# ============================================================
# 机制驱动自动化流水线（非手动 / 命令推进）
# 说明: 本项目流程推进全部由事件机制驱动，无需人工手动发 / 命令。
#   触发链：
#     1. 新建 Issue（issue.open）→ 游戏向经理 NPC 自动拆解架构
#        并派发工作包给各部门，自动协同（无需 / 命令）。
#     2. 提交 PR（pull_request）→ 测试信号灯 + 自动分配评审人 + NPC 代码审查，
#        构成「评审→修复」闭环（方案 A）：需修改则 CodeBuddy 就地修复并重推，
#        直到无 bug 才放行合并（钩子没 bug 就停）。
#     3. PR 满足合并条件（pull_request.mergeable）→ git:auto-merge 自动合并。
#     4. 合并后（pull_request.merged）→ 自动解锁下游部门 / 更新 Issue。
#
#   「多源触发、按场景分」设计（回应：触发信号不应只支持一种，而是多源并存兼容）：
#     - pull_request            → 主闭环：任何修复推送都会触发，CI 重跑 + 评审 + 就地修复。
#                                 驳回必然触发 push（修完必推），没更新则 push 文档性「放弃此
#                                 部分迭代」或转其他 issue/PR 解决并关闭，让评审监控对齐进度。
#     - pull_request.changes_requested → 兼容人工评审者以 git「需要改进」形式打回。
#     - pull_request.comment@npc → 兼容人类主动 @CodeBuddy 点名驱动（手动兜底）。
#     - failStages（失败自动触发）→ stages 阶段（测试信号灯 / 评审 / 修复 / 合并门禁）
#       任一失败时，自动唤起 CodeBuddy 处置失败事件：可修代码 bug 就地修 + 补断言 + push
#       （自然进入主闭环复审）；环境/权限类（如 push 403 缺 repo-code:rw）显式告警 @ 仓库
#       负责人；无法就地解决则转交/文档性提交对齐进度。全程无人工点名，失败事件自己把
#       CodeBuddy 拉进流程。
#     四种触发源并存不互相替换，各自覆盖不同场景。
# 镜像复用：所有 npc:go 阶段共用下方锚点镜像，改动一处即可全局生效，
#   避免每个 pipeline 各自硬编码镜像（供应链一致性）。
# ============================================================

# ---- 事件驱动：Issue 新建 → 游戏向经理自动拆解派单 ----
$:
  issue.open:
    - name: game-manager-orchestrate
      docker:
        image: &npc_image cnbcool/default-npc:latest
      stages:
        - name: 游戏向经理自动拆解
          type: npc:go
          options:
            role: 游戏向经理
            systemPrompt: |
              你是游戏开发项目的"游戏向经理"（制作人 + 项目经理融合）。
              职责：把架构蓝图拆解为部门可执行的工作包，按部门分配任务与资源，
              并通过事件驱动机制自动推进部门间协作，不依赖任何手动 / 命令。
              使用 config/game_producer_agent.py 的拆分逻辑。
            userPrompt: |
              收到新 Issue 需求，请作为游戏向经理执行以下机制化编排：
              1. 分析 Issue 描述中的架构/需求目标；
              2. 按 config/roles.yaml 的六大部门（策划/程序/美术/测试/项目管理/运营）
                 把架构拆解为可执行工作包；
              3. 为每个工作包分配责任部门、主责角色与资源优先级；
              4. 通过 task_scheduler 事件驱动派发，按依赖自动推进部门协作；
              5. 在 Issue 评论中输出工作包拆分表与部门协作依赖图。
              全程机制驱动，无需人工手动推进度。

# ---- 事件驱动：PR 提交 → 「评审→修复」闭环（主触发源，方案 A）----
# 借鉴架构师 Agent 的“测试信号灯”护栏：PR 提交先跑测试断言，
# 未通过即红灯阻塞，不放行后续评审/合并，避免“半成品”进入流水线。
# 这是最主要的触发源：任何修复推送（修完必推）都会触发本流水线重跑，
# 评审若“需修改”则进入同一条流水线内的 CodeBuddy 就地修复并重推，
# 形成天然多轮循环——直到评审通过（无 bug）才停（钩子没 bug 就停）。
  pull_request:
    - name: review-fix-loop
      docker:
        image: *npc_image
      stages:
        - name: 测试信号灯
          script: |
            bash game-studio-agents/tests/test_producer_agent.sh
            bash game-studio-agents/tests/test_instantiator.sh
            bash game-studio-agents/tests/test_end_to_end.sh
            bash game-studio-agents/tests/test_progress_pusher.sh
            bash game-studio-agents/tests/test_instantiated_e2e.sh
            bash game-studio-agents/tests/test_review_fix_loop.sh
            bash game-studio-agents/tests/test_market_input_bridge.sh
            bash game-studio-agents/tests/test_ecosystem_roles.sh
            bash game-studio-agents/tests/test_art_direction.sh
            bash game-studio-agents/tests/test_data_ops_diagnosis.sh
            bash game-studio-agents/tests/test_progress_pusher_fullchain.sh
            bash game-studio-agents/tests/test_release_gate.sh
            pip install -q -r game-studio-agents/api/requirements.txt
            bash game-studio-agents/api/test_api.sh
        - name: 自动分配评审人
          type: git:reviewer
          options:
            type: add-reviewer
            count: 1
        - name: NPC 代码审查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是游戏开发项目的资深代码审查员，负责审查各部门提交的代码质量、
              架构合理性、潜在 Bug 与安全漏洞，并给出可落地的改进建议。
            userPrompt: |
              请审查本次 PR 的代码变更，重点检查：
              1. 是否符合 config/roles.yaml 与 config/game_producer_agent.py 的架构约束；
              2. 机制化编排逻辑是否正确（消息总线 / 调度器 / 依赖解锁）；
              3. 是否存在 Bug、安全漏洞或资源泄漏；
              4. 给出"通过 / 需修改"结论及具体修改点。
              在 PR 评论中输出审查结论。
        - name: CodeBuddy 闭环修复（评审→修复→重推，钩子没 bug 就停）
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是代码修复 NPC（CodeBuddy）。在「评审→修复」闭环中，收到评审"需修改"
              后默认直接修改并重新提交，遵循"评审-修复闭环护栏"（docs/评审修复闭环护栏.md）：
              - 默认直接改：评审指出的问题（尤其 bug）默认应直接修复，不反复询问；
              - 最大 10 轮护栏：同一 PR 的评审→修复来回最多 10 次，达到上限仍无法
                解决则停止自动修复，在 PR 评论中反馈人类，由人类改需求/框架；
              - 每修一个评审点，尽量固化成测试断言，防止回退；
              - 钩子没 bug 就停：若评审结论为"通过/approved"，说明无 bug，直接结束本阶段，
                不再改动任何内容，交由后续合并门禁处理。
            userPrompt: |
              本次 PR 已完成一轮评审。请作为 CodeBuddy 读取最新评审结论并闭环处理：
              1. 读取本 PR 上最新的 OCI/代码审查员评审结论（含行级评论）；
              2. 判定评审结论：
                 - 若为"通过/approved"（无 bug）：说明本轮无需修复，直接输出"评审通过，
                   等待合并门禁"，不修改任何代码，结束本阶段（钩子没 bug 就停）；
                 - 若为"需修改/需改进"：进入第 3 步；
              3. 检查本 PR 已进行的"评审→修复"轮次是否达 10 轮上限：
                 - 未达上限：默认直接修复评审指出的问题（Bug 优先，再质量/性能/架构），
                   在 PR 源分支修改代码并补充测试断言后重新 push（本轮修复必触发一次新的
                   pull_request 事件，从而自动进入下一轮评审——驳回必然触发 push）；
                 - 已达上限仍未解决：停止自动修复，在 PR 评论中明确反馈人类，说明需要改
                   需求或改框架，不再盲修；
              4. 上下文路由与降级显性化（遵循"评审-修复闭环护栏"第五章）：
                 - 优先通过全局ID（PR 编号）+ sessionID 路由到**提交本 PR 的原对话上下文**，
                   继承其完整上下文（需求背景/架构约束/改动意图）来修复，不当作全新任务；
                 - 若原对话上下文不可路由（无 sessionID/已失效）：降级到哈希校验兜底，但
                   **必须显性输出降级说明**（原因 + 丢失的上下文信息），禁止静默降级，
                   否则一直丢上下文会导致修复效果持续变弱；
              5. 「放弃此部分迭代」处置：若某问题虽被评审驳回、但无法在本 PR 就地解决
                 （超范围 / 需要先改需求或框架 / 属于另一模块），应做明确的动作而非空转：
                 - 优先：判断该问题是否可从其他 issue/PR 解决——若是，则在 PR 评论中说明
                   转交到哪个 issue/PR 解决，并按平台规范关闭本 PR 或标记放弃该部分迭代；
                 - 否则：做一个文档性、零行为变更的提交（如在该 PR 记录"放弃此部分迭代"
                   的原因与处置），再 push 一次以对齐进度，让评审/监控能持续追踪；
              6. 全程机制驱动，修复完成即结束本阶段，等待下一轮评审。
              7. 【推送稳定性·强制自检】每次修复后必须 push，push 后立即验证是否成功：
                 - 若 push 返回权限错误 / 403（多为 NPC 机器人 token 缺 `repo-code:rw`
                   推送权限）：**不得静默卡死**，必须立即在本 PR 评论中显式告警，明确
                   @ 仓库负责人「需要给机器人 token 补 `repo-code:rw` 推送权限」，并列出
                   已完成的修复点，说明推不上去将无法触发下一轮评审闭环；
                 - 若 push 成功：确认触发新一轮 pull_request 评审事件，继续闭环；
                 - 绝不允许：修复完成后因 push 失败而无任何告警地结束，导致评审闭环
                   在"推送"这一步静默中断、看起来像评审机制失效。
        - name: 评审闭环健康检查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是评审闭环健康检查员。在合并门禁前核查本 PR 的「评审→修复→重推」闭环
              是否真正走通，防止"修复推了但评审没跟上"的假完成状态，增强稳定性。
            userPrompt: |
              请核查本次 PR 的评审闭环健康状况（重点防静默中断），**先区分「正常待评审」
              与「真正闭环中断」两种情况，禁止仅因"最新 head 暂无评审结论"就误判中断**：

              A. 正常待评审（应放行，不中断流水线）：本 run 内 CodeBuddy 已完成修复并 push
                 → 修复 push 会触发**下一轮** pull_request 评审 run，此刻本 run 拿不到最新
                 head 的评审结论是**正常状态**。若本次 head 的评审结论尚未产生，但 push 成功
                 且已触发新一轮评审事件，即视为闭环正常推进，放行等下一轮跟进，不得中断；

              B. 真正闭环中断（须满足**至少一个硬性信号**，否则不算中断）：
                 - 推送失败：push 返回 403（缺 repo-code:rw 推送权限），且修复根本没推上去；
                 - 推送成功但长时间（超时阈值）无任何后续评审 run 跟进；
                 - 评审结论长期停留在"需修改"且超过 10 轮上限仍未收敛。
                 满足任一信号才显式输出"评审闭环中断"告警，说明中断环节（推送 / 评审触发 /
                 评审结论）与处置建议（如补机器人 token 的 repo-code:rw 推送权限），并中断
                 流水线返回失败，不放行合并；

              4. 若闭环正常且已有评审结论：进入合并门禁校验。
        - name: 合并门禁检查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是合并门禁把关人。pull_request.mergeable 只代表代码可合并，
              不代表评审已通过。你的职责是在自动合并前校验评审门禁。
            userPrompt: |
              本次 PR 已完成评审-修复闭环。请在校验后才放行自动合并：
              1. 检查本 PR 的评审状态是否为 approved；
              2. 检查是否存在 changes_requested / 未解决的打回评论；
              3. 只有评审通过且无未解决阻塞项时，才输出“放行”并结束本阶段；
              4. 若评审未通过或存在打回项，必须中断流水线（返回失败），
                 禁止自动合并，等待打回修复后再走门禁。

      failStages:
        - name: 失败自动唤起 CodeBuddy 处置
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是代码修复 NPC（CodeBuddy）。本流水线的 stages 阶段（测试信号灯 /
              评审 / 修复 / 合并门禁）发生失败时，由你自动处置失败事件。遵循
              "评审-修复闭环护栏"（game-studio-agents/docs/评审修复闭环护栏.md）：
              - 默认直接改：失败可归因于代码 bug 的，默认直接修复，不反复询问；
              - 最大 10 轮护栏：同一 PR 的失败→修复来回最多 10 次，达上限仍无法
                解决则停止自动修复，在 PR 评论反馈人类，由人类改需求/框架；
              - 每修一个失败点，尽量固化成测试断言，防止回退；
              - 无法就地解决的（环境/权限/超范围）：不盲改，显式转交或告警。
            userPrompt: |
              本次 PR 的构建/测试/评审阶段失败（红灯）。请作为 CodeBuddy 自动处置：
              1. 读取本次失败日志（CI 报错 / 测试断言失败 / push 403 / 评审卡死等）；
              2. 区分失败类型：
                 - 可修代码问题（测试红灯、评审"需修改"、机制 Bug）：默认直接在 PR
                   源分支修复 + 补断言并 push（push 必触发新一轮 pull_request，自然
                   进入主闭环复审，钩子没 bug 就停）；
                 - 环境/权限类（如 push 403 缺 repo-code:rw）：在 PR 评论显式 @ 仓库
                   负责人告警，说明需人工补 token，不盲改代码；
                 - 无法就地解决 / 超范围：按"放弃此部分迭代"处置，转交其他 issue/PR
                   或做文档性提交 push 对齐进度，不空转；
              3. 上下文路由与降级显性化（遵循"评审-修复闭环护栏"第五章）：优先通过
                 全局ID（PR 编号）+ sessionID 路由到原对话上下文修复；不可路由时降级
                 哈希校验兜底，但必须显性输出降级说明，禁止静默降级；
              4. 检查本 PR 已进行的失败→修复轮次是否达 10 轮上限：
                 - 未达上限：修复后 push，等待下一轮触发；
                 - 已达上限仍未解决：停止自动修复，在 PR 评论明确反馈人类；
              5. 【推送稳定性·强制自检】每次修复后必须 push，push 后立即验证是否成功：
                 - 若 push 返回权限错误 / 403：**不得静默卡死**，立即在 PR 评论显式
                   告警 @ 仓库负责人补 `repo-code:rw` 推送权限，列出已修复点；
                 - 若 push 成功：确认触发新一轮 pull_request 评审事件，继续闭环；
                 - 绝不允许：修复后因 push 失败而无任何告警地结束，导致闭环在"推送"
                   这一步静默中断、看起来像失败自动触发机制失效。
              全程机制驱动，处置完成即结束本阶段，等待下一轮事件触发。

# ---- 事件驱动：PR 可合并 → 自动合并（满足门禁后无需人工）----
# 说明: pull_request.mergeable 只代表“代码可合并”（无冲突/CI 通过），
#      不代表“评审已通过”。因此在 auto-merge 之前增加一道“评审门禁”，
#      由代码审查员 NPC 校验，只有评审通过才放行自动合并。
  pull_request.mergeable:
    - name: auto-merge
      docker:
        image: *npc_image
      stages:
        - name: 合并门禁检查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是合并门禁把关人。pull_request.mergeable 只代表代码可合并，
              不代表评审已通过。你的职责是在自动合并前校验评审门禁。
            userPrompt: |
              本次 PR 已达到可合并条件，请在校验后才放行自动合并：
              1. 检查本 PR 的评审状态是否为 approved；
              2. 检查是否存在 changes_requested / 未解决的打回评论；
              3. 只有评审通过且无未解决阻塞项时，才输出“放行”并结束本阶段；
              4. 若评审未通过或存在打回项，必须中断流水线（返回失败），
                 禁止自动合并，等待打回修复后再走门禁。
        - name: 自动合并
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true

# ---- 事件驱动：PR 合并后 → 自动更新 Issue 并解锁下游 ----
  pull_request.merged:
    - name: post-merge-orchestrate
      docker:
        image: *npc_image
      stages:
        - name: 合并后联动
          type: npc:go
          options:
            role: 游戏向经理
            systemPrompt: |
              你是游戏开发项目的"游戏向经理"，负责在 PR 合并后自动推进后续部门工作。
            userPrompt: |
              本次 PR 已合并，请作为游戏向经理：
              1. 分析合并后的新代码对各部门工作包的影响；
              2. 解锁依赖本 PR 产出的下游部门工作包并自动派发；
              3. 更新对应 Issue 状态（标注进展/下一阶段）；
              4. 在 Issue 中评论合并后的下一步协作计划。
              全程机制驱动，无需人工手动推进度。

# ---- 触发源 2：人工评审者以 git「需要改进」形式打回 → CodeBuddy 自动修复 ----
# 兼容场景：人类评审人在评审界面对 PR 提交「changes_requested」（需要改进）结论时触发。
# 这是人工 git 级打回的触发源，与 pull_request（主闭环）并存互补，不互相替换。
  pull_request.changes_requested:
    - name: auto-fix-review
      docker:
        image: *npc_image
      stages:
        - name: CodeBuddy 自动修复
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是代码修复 NPC（CodeBuddy）。收到评审打回后默认直接修改代码并重新
              提交，遵循"评审-修复闭环护栏"（docs/评审修复闭环护栏.md）：
              - 默认直接改：评审指出的问题（尤其 bug）默认应直接修复，不反复询问；
              - 最大 10 轮护栏：同一 PR 的评审→修复来回最多 10 次，达到上限仍无法
                解决则停止自动修复，在 PR 评论中反馈人类，由人类改需求/框架；
              - 每修一个评审点，尽量固化成测试断言，防止回退；
              - 放弃此部分迭代：若问题无法在本 PR 就地解决，转交其他 issue/PR 解决并
                关闭本 PR，或做文档性提交 push 以对齐进度。
            userPrompt: |
              本次 PR 被评审打回（changes requested）。请作为 CodeBuddy 执行：
              1. 读取评审意见与行级评论；
              2. 默认直接修复评审指出的问题（Bug 优先，再质量/性能/架构），
                 在 PR 源分支修改代码并重新提交；
              3. 为每个修复点补充测试断言，确保持续生效不回退；
              4. 上下文路由与降级显性化（遵循"评审-修复闭环护栏"第五章）：
                 - 优先通过全局ID（PR 编号）+ sessionID 路由到**提交本 PR 的原对话上下文**，
                   继承其完整上下文来修复，不当作全新任务；
                 - 若原对话上下文不可路由（无 sessionID/已失效）：降级到哈希校验兜底，但
                   **必须显性输出降级说明**（原因 + 丢失的上下文信息），禁止静默降级；
              5. 检查本 PR 已进行的评审→修复轮次是否达 10 轮上限：
                 - 未达上限：修复后等待下一轮评审；
                 - 已达上限仍未解决：停止自动修复，在 PR 评论中明确反馈人类，
                   说明需要改需求或改框架，不再盲修；
              6. 若某问题无法在本 PR 就地解决：优先转交其他 issue/PR 解决并关闭本 PR，
                 否则做文档性提交 push 对齐进度。
              7. 【推送稳定性·强制自检】push 后立即验证是否成功：
                 - 若 push 返回权限错误 / 403（多为机器人 token 缺 `repo-code:rw`）：
                   **不得静默卡死**，立即在本 PR 评论显式告警 @ 仓库负责人补推送权限，
                   列出已修复点并说明推不上去将无法触发下一轮评审；
                 - 若 push 成功：确认触发新一轮 pull_request 评审，继续闭环。
              全程机制驱动。

# ---- 触发源 3：人类主动 @CodeBuddy 点名驱动（手动兜底）----
# 兼容场景：人类在 PR 评论中 @CodeBuddy 主动要求修复/处理时触发（pull_request.comment@npc）。
# 这是人工手动兜底的触发源，与 pull_request 主闭环、changes_requested 并存互补。
  pull_request.comment@npc:
    - name: npc-manual-invoke
      docker:
        image: *npc_image
      stages:
        - name: CodeBuddy 按 @ 指令处理
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是代码修复 NPC（CodeBuddy）。人类在 PR 评论中 @你，请按指令处理，
              并遵循"评审-修复闭环护栏"（docs/评审修复闭环护栏.md）：默认直接改、
              最大 10 轮、每修一点补断言、超限或无法就地解决时反馈人类/转交。
            userPrompt: |
              人类在评论中 @CodeBuddy 发起了指令。请按评论内容执行：
              1. 若指令是要求修复评审问题：默认直接改，在 PR 源分支修改并 push，
                 补断言，检查轮次上限；
              2. 若指令是询问/探讨（如机制设计、选型）：直接给出分析与结论，
                 不修改代码；
              3. 若指令是要求落地某机制（如多源触发）：按指令修改 .cnb.yml 或文档
                 并在 PR 源分支提交；
              4. 若问题无法在本 PR 就地解决：说明转交其他 issue/PR 或做文档性提交。
              全程机制驱动。
