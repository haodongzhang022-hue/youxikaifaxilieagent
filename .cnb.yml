# ============================================================
# 机制驱动自动化流水线（非手动 / 命令推进）
# 说明: 本项目流程推进全部由事件机制驱动，无需人工手动发 / 命令。
#   触发链：
#     1. 新建 Issue（issue.open）→ 游戏向经理 NPC 自动拆解架构
#        并派发工作包给各部门，自动协同（无需 / 命令）。
#     2. 提交 PR（pull_request）→ 测试信号灯 + 自动分配评审人 + NPC 代码审查，
#        构成「评审→修复」闭环（方案 A）：需修改则**本仓库仓库处理专员**就地修复并
#        **打标签**标记状态（优先；本仓库未部署时触发克隆仓库处理专员到本仓库后用），直到无
#        bug 才放行合并（钩子没 bug 就停）。
#        **本系统故意设计不允许 push**：评审闭环通过打标签驱动，不依赖 push 事件。
#     3. PR 满足合并条件（pull_request.mergeable）→ git:auto-merge 自动合并。
#     4. 合并后（pull_request.merged）→ 自动解锁下游部门 / 更新 Issue。
#
#   「多源触发、按场景分」设计（回应：触发信号不应只支持一种，而是多源并存兼容）：
#     - pull_request            → 主闭环：任何修复提交都会触发，CI 重跑 + 评审 + 就地修复。
#                                 评审闭环通过**打标签**驱动（如「适合合并」「适合关闭」），
#                                 **禁止 push**（本系统故意设计不允许 push，push 会导致 403
#                                 与闭环中断）。评审给意见 → 仓库处理专员修代码 → 打标签触发
#                                 下一轮，不依赖 push 事件（本仓库未部署时触发克隆仓库处理专员到本仓库后用）。
#     - pull_request.changes_requested → 兼容人工评审者以 git「需要改进」形式打回。
#     - pull_request.comment@npc → 兼容人类主动 @仓库处理专员 / @CodeBuddy 点名驱动
#       （手动兜底）。本仓库修复优先由仓库处理专员承接；未部署时触发克隆一份到本仓库。
#     - failStages（失败自动触发）→ stages 阶段（测试信号灯 / 评审 / 修复 / 合并门禁）
#       任一失败时，自动唤起**仓库处理专员**处置失败事件：可修代码 bug 就地修 +
#       补断言 + **打标签**标记状态（如「适合推送」触发复审）；环境/权限类显式告警
#       @ 仓库负责人；无法就地解决则转交/打标签标记关闭。全程无人工点名，失败事件
#       自己把仓库处理专员拉进流程（本仓库未部署时触发克隆一份到本仓库）。
#     四种触发源并存不互相替换，各自覆盖不同场景。
# 镜像复用：所有 npc:go 阶段共用下方锚点镜像，改动一处即可全局生效，
#   避免每个 pipeline 各自硬编码镜像（供应链一致性）。
# ============================================================

# ---- 事件驱动：Issue 新建 → 游戏向经理自动拆解派单 ----
$:
  issue.open:
    - name: game-manager-orchestrate
      docker:
        image: &npc_image cnbcool/default-npc:latest
      stages:
        - name: 游戏向经理自动拆解
          type: npc:go
          options:
            role: 游戏向经理
            systemPrompt: |
              你是游戏开发项目的"游戏向经理"（制作人 + 项目经理融合）。
              职责：把架构蓝图拆解为部门可执行的工作包，按部门分配任务与资源，
              并通过事件驱动机制自动推进部门间协作，不依赖任何手动 / 命令。
              使用 config/game_producer_agent.py 的拆分逻辑。
            userPrompt: |
              收到新 Issue 需求，请作为游戏向经理执行以下机制化编排：
              1. 分析 Issue 描述中的架构/需求目标；
              2. 按 config/roles.yaml 的六大部门（策划/程序/美术/测试/项目管理/运营）
                 把架构拆解为可执行工作包；
              3. 为每个工作包分配责任部门、主责角色与资源优先级；
              4. 通过 task_scheduler 事件驱动派发，按依赖自动推进部门协作；
              5. 【部门级 vs 角色级派发】判断每个工作包适合哪种派发粒度：
                 - 任务横跨多个角色 → 按**部门整体**派发（@当前仓库slug(部门名)）；
                 - 任务聚焦单角色 → 按 **role_id** 直投给具体角色；
              6. 在 Issue 评论中输出工作包拆分表与部门协作依赖图。
              部门流水线顺序：策划 → 程序 → 美术 → 测试 → 项目管理 → 运营。
              全程机制驱动，无需人工手动推进度。


        - name: 策划线执行
          type: npc:go
          options:
            role: 策划线
            systemPrompt: |
              你是游戏开发的**策划线**部门 NPC（小组）。部门名=策划线 已注册为可召唤/可派发目标。
              【部门统一头】部门 == 一个 NPC 小组，你是统一头：@ 策划线 = 一次 @ 部门内多个角色。
              【组内协作·必做】承接跨角色任务后，经协作工作台（role_collaboration）把子任务 @分工
                拆派给部门内各角色，复用「@ 其他 agent 安排记忆与任务」能力，全程留痕可审计（group_audit）。
              【跨部门协作·必做】任务需要其他部门协助时，跨部门 @协作请求/转交（request_peer）。
              【统一派发工作能力】你具备 config/dispatch_capability.py 的派发能力，可把子任务按 role_id 派发。
              【仓库自适应识别】使用 config/agent_identity.py（AgentIdentity）识别当前仓库，
                跨仓库协作用完整格式 @<当前仓库slug>(角色名) 召唤。
              本部门职责：玩法/系统/数值/关卡/剧情/战斗设计，产出设计文档与数值模型。
            userPrompt: |
              游戏向经理已在 Issue 中拆解并派发工作包。你是**策划线**部门统一头（小组），
              请执行：
              1. 从 Issue 评论中的工作包拆分表，领取**本部门（策划线）负责的工作包**；
              2. 【组内协作·必做】把跨角色的工作包经协作工作台 @分工 拆派给部门内各角色执行，
                全程留痕可审计（group_audit）；若工作包聚焦单一角色则直接执行；
              3. 【跨部门协作·必做】工作包需要其他部门协助时，跨部门 @协作请求/转交（request_peer）；
              4. 汇总组内子任务产出，向游戏向经理上报 REVIEW_RESULT（通过/打回 + 产出物说明）；
              5. 在 Issue 评论输出本部门承接结果、组内分工表与跨部门协作记录。
              若 Issue 中无本部门工作包，评论说明「无本部门工作包，本轮跳过」即可。
              部门流水线顺序：策划 → 程序 → 美术 → 测试 → 项目管理 → 运营。
              全程机制驱动。
