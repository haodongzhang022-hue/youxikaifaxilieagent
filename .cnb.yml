# ---- 触发源 2：人工评审者以 git「需要改进」形式打回 → 仓库处理专员 自动修复 ----
# 兼容场景：人类评审人在评审界面对 PR 提交「changes_requested」（需要改进）结论时触发。
# 这是人工 git 级打回的触发源，与 pull_request（主闭环）并存互补，不互相替换。
# 本仓库修复闭环优先由仓库处理专员承接；CodeBuddy 仅提供建议。
  pull_request.changes_requested:
    - name: auto-fix-review
      docker:
        image: *npc_image
      stages:
        - name: 仓库处理专员 自动修复
          type: npc:go
          options:
            role: 仓库处理专员
            systemPrompt: |
              你是**本仓库专属**的代码修复 Agent（仓库处理专员）。收到评审打回后默认
              直接修改代码并提交，遵循"评审-修复闭环护栏"（docs/评审修复闭环护栏.md）：
              - **本系统故意设计不允许 push**：修复完成后通过**打标签**标记状态
                （如「适合推送」/「适合合并」），**绝不尝试 push**（会触发 403 报错、
                破坏闭环），也不得输出"push 失败 / 403"类错误信息；
              - 默认直接改：评审指出的问题（尤其 bug）默认应直接修复，不反复询问；
              - 最大 10 轮护栏：同一 PR 的评审→修复来回最多 10 次，达到上限仍无法
                解决则停止自动修复，在 PR 评论中反馈人类，由人类改需求/框架；
              - 每修一个评审点，尽量固化成测试断言，防止回退；
              - 放弃此部分迭代：若问题无法在本 PR 就地解决，转交其他 issue/PR 解决并
                关闭本 PR，或打「适合关闭」标签标记应关闭；
              - 与通用 CodeBuddy **并存互补**：本仓库修复优先由你承接，CodeBuddy 仅提供建议。
            userPrompt: |
              本次 PR 被评审打回（changes requested）。请作为本仓库仓库处理专员执行：
              1. 读取评审意见与行级评论；
              2. 默认直接修复评审指出的问题（Bug 优先，再质量/性能/架构），
                 在 PR 源分支修改代码并重新提交；
              3. 为每个修复点补充测试断言，确保持续生效不回退；
              4. 上下文路由与降级显性化（遵循"评审-修复闭环护栏"第五章）：
                 - 优先通过全局ID（PR 编号）+ sessionID 路由到**提交本 PR 的原对话上下文**，
                   继承其完整上下文来修复，不当作全新任务；
                 - 若原对话上下文不可路由（无 sessionID/已失效）：降级到哈希校验兜底，但
                   **必须显性输出降级说明**（原因 + 丢失的上下文信息），禁止静默降级；
              5. 检查本 PR 已进行的评审→修复轮次是否达 10 轮上限：
                 - 未达上限：修复后**打「适合推送」标签**标记修复完成，触发下一轮评审
                   （**禁止 push**，本系统故意设计不允许 push）；
                 - 已达上限仍未解决：停止自动修复，在 PR 评论中明确反馈人类，
                   说明需要改需求或改框架，不再盲修；
              6. 若某问题无法在本 PR 就地解决：优先转交其他 issue/PR 解决并关闭本 PR，
                 否则**打「适合关闭」标签**标记应关闭。
              7. 【标签驱动·强制自检】修复完成后必须**打标签**标记状态，打标签后立即
                 验证是否成功：
                 - 若标签成功：确认触发新一轮 pull_request 评审，继续闭环。
                 - 若打标签失败：在 PR 评论中显式告警说明失败原因与已完成的修复点；
                 - **禁止尝试 push**：本系统故意设计不允许 push（会触发 403 报错、
                   破坏评审闭环），任何 NPC 不得尝试 push，也不得在评论中输出
                   "push 失败 / 403"类错误信息。

              全程机制驱动。

# ---- 触发源 3：人类主动 @仓库处理专员/@CodeBuddy 点名驱动（手动兜底）----
# 兼容场景：人类在 PR 评论中 @仓库处理专员 / @CodeBuddy 主动要求修复/处理时触发
# （pull_request.comment@npc）。
# 这是人工手动兜底的触发源，与 pull_request 主闭环、changes_requested 并存互补。
# 本仓库修复优先由仓库处理专员承接；CodeBuddy 仅提供建议（不执行打标签）。
  pull_request.comment@npc:
    - name: npc-manual-invoke
      docker:
        image: *npc_image
      stages:
        - name: 仓库处理专员/CodeBuddy 按 @ 指令处理
          type: npc:go
          options:
            role: 仓库处理专员
            systemPrompt: |
              你是**本仓库专属**的代码修复 Agent（仓库处理专员），是**打标签唯一执行者**。
              CodeBuddy 仅提供信息和建议（无打标签权限）。人类在 PR 评论中
              @你 / @CodeBuddy，请按指令处理，并遵循"评审-修复闭环护栏"
              （docs/评审修复闭环护栏.md）：默认直接改、最大 10 轮、每修一点补断言、
              超限或无法就地解决时反馈人类/转交。
              **本系统故意设计不允许 push**：修复完成后通过**打标签**标记状态
              （如「适合推送」/「适合合并」），**绝不尝试 push**（会触发 403 报错、
              破坏闭环），也不得输出"push 失败 / 403"类错误信息。
            userPrompt: |
              人类在评论中 `@仓库处理专员` / `@CodeBuddy` 发起了指令。请按评论内容执行：
              1. 若指令是要求修复评审问题：默认直接改，在 PR 源分支修改并补断言，
                 **打「适合推送」标签**标记修复完成（**禁止 push**，本系统故意设计
                 不允许 push），检查轮次上限；
              2. 若指令是询问/探讨（如机制设计、选型）：直接给出分析与结论，
                 不修改代码；
              3. 若指令是要求落地某机制（如多源触发）：按指令修改 .cnb.yml 或文档
                并在 PR 源分支提交；
              4. 若问题无法在本 PR 就地解决：说明转交其他 issue/PR 或打「适合关闭」
                 标签标记应关闭。
              全程机制驱动。

# ---- 合并标签确认机制（类似审查机制，探查合并标签 issue 个数）----
# 说明: 定时探查仓库中带「已合并」标签但状态仍为 open 的 Issue，
#       若数量 > 0 则触发「合并确认员」NPC 逐个确认：
#         - 已合并且无后续任务 → 关闭 Issue；
#         - 已合并但有明确后续任务（未派发）→ 新建 Issue 承接并分配任务，关闭原 Issue；
#         - 已合并但仍有阻塞/待复核/依赖未收尾 → 保留 Issue。
#   实现: config/merged_confirm_agent.py（探查 probe / 确认 confirm / 决策 decide）
#   crontab 事件必须放在具体分支名下（此处放 main）。
#   频率: 每天 06:00 Asia/Shanghai（可调整 cron 表达式）
main:
  "crontab: 0 6 * * *":
    - name: merged-confirm-sweep
      docker:
        image: *npc_image
      stages:
        # 阶段名保持与职责一致：此处仅运行 __main__ 自测（冒烟），
        # 不执行真实探查；真实探查由下一阶段 npc:go「合并确认员」通过 CNB API 完成。
        - name: 自测冒烟
          script: |
            cd game-studio-agents
            echo "== 合并确认 Agent 自测冒烟（不执行真实探查）=="
            python3 config/merged_confirm_agent.py
        - name: 合并确认员逐个确认
          type: npc:go
          options:
            role: 合并确认员
            systemPrompt: |
              你是「合并确认员」（Merged Confirmer）。负责对仓库中已打上「已合并」
              标签但仍处于 open 状态的 Issue 做工作内容确认——判断当前对话是否还有
              内容需要推进，还是已适合关闭。你独立于 CodeBuddy，专责确认环节。
              使用 config/merged_confirm_agent.py 的探查/确认/决策逻辑。
            userPrompt: |
              请执行合并标签确认工作流：
              1. 使用 CNB API 探查仓库中带「已合并」相关标签（如「安全加固已合并」
                 「经理编排已合并」「预设体系已合并」「生态角色体系已合并」等）且
                 状态仍为 open 的 Issue，统计数量 N；
              2. 若 N == 0：说明无待确认 Issue，在本流水线日志输出「无需确认」并结束；
              3. 若 N > 0：逐个确认每个候选 Issue——读取其标题/描述/标签/评论历史，
                 判断是否有待推进内容：
                 - 已合并且无后续任务（下游已由新 Issue 承接）→ 关闭该 Issue，
                   在 Issue 评论输出确认结论「工作已完成，已合并，关闭」；
                 - 已合并但有明确后续任务（未派发）→ 新建 Issue 承接该后续任务并
                   分配处理人，然后关闭原 Issue，在原 Issue 评论说明「后续已派发到
                   #新Issue」；
                 - 已合并但仍有阻塞/待复核/依赖未收尾 → 保留 Issue，在评论说明
                   「仍待推进」原因；
              4. 在探查到的最新 Issue 上（或本流水线日志）汇总输出确认结果表。
              5. 【防静默失效·强制自检】每次执行关闭 Issue / 新建 Issue / 评论回写
                 等写操作后，必须核验 CNB API 实际返回结果：
                 - 若操作成功（HTTP 200）：确认在日志与评论中记录实际结果；
                 - 若操作失败（非 200 / 返回错误码）：**不得静默吞掉**，必须在本
                   流水线日志与 PR/Issue 评论中显式告警 @ 仓库负责人，说明失败环节、
                   失败原因与处置建议（如检查 NPC 身份/权限配置）；
                 - N==0 时仍需验证探查 API 调用本身成功（HTTP 200 且有数据返回），
                   若探查本身失败（403/超时/返回异常），同样需要显式告警而非输出
                   「无需确认」；
              6. 若因身份/权限不足导致写操作全部失败，停止后续操作并汇总告警，
                 禁止把「操作失败」吞成「无需确认」。
              全程机制驱动，无需人工推进。
              注意：不要合并/修改代码，只做 Issue 状态确认与派发。
