# ============================================================
# 机制驱动自动化流水线（非手动 / 命令推进）
# 说明: 本项目流程推进全部由事件机制驱动，无需人工手动发 / 命令。
#   触发链：
#     1. 新建 Issue（issue.open）→ 游戏向经理 NPC 自动拆解架构
#        并派发工作包给各部门，自动协同（无需 / 命令）。
#     2. 提交 PR（pull_request）→ 测试信号灯 + 自动分配评审人 + NPC 代码审查，
#        构成「评审→修复」闭环（方案 A）：需修改则触发本仓库修复专员就地修复并重推，
#        直到无 bug 才放行合并（钩子没 bug 就停）。
#     3. PR 满足合并条件（pull_request.mergeable）→ git:auto-merge 自动合并。
#     4. 合并后（pull_request.merged）→ 自动解锁下游部门 / 更新 Issue。
#
#   「多源触发、按场景分」设计（回应：触发信号不应只支持一种，而是多源并存兼容）：
#     - pull_request            → 主闭环：任何修复推送都会触发，CI 重跑 + 评审 + 就地修复。
#                                 驳回必然触发 push（修完必推），没更新则 push 文档性「放弃此
#                                 部分迭代」或转其他 issue/PR 解决并关闭，让评审监控对齐进度。
#     - pull_request.changes_requested → 兼容人工评审者以 git「需要改进」形式打回。
#     - pull_request.comment@npc → 兼容人类主动 @CodeBuddy 点名驱动（手动兜底）。
#     三种触发源并存不互相替换，各自覆盖不同场景。
# 镜像复用：所有 npc:go 阶段共用下方锚点镜像，改动一处即可全局生效，
#   避免每个 pipeline 各自硬编码镜像（供应链一致性）。
# ============================================================

# ---- 事件驱动：Issue 新建 → 游戏向经理自动拆解派单 ----
$:
  issue.open:
    - name: game-manager-orchestrate
      docker:
        image: &npc_image cnbcool/default-npc:latest
      stages:
        - name: 游戏向经理自动拆解
          type: npc:go
          options:
            role: 游戏向经理
            systemPrompt: |
              你是游戏开发项目的"游戏向经理"（制作人 + 项目经理融合）。
              职责：把架构蓝图拆解为部门可执行的工作包，按部门分配任务与资源，
              并通过事件驱动机制自动推进部门间协作，不依赖任何手动 / 命令。
              使用 config/game_producer_agent.py 的拆分逻辑。
            userPrompt: |
              收到新 Issue 需求，请作为游戏向经理执行以下机制化编排：
              1. 分析 Issue 描述中的架构/需求目标；
              2. 按 config/roles.yaml 的六大部门（策划/程序/美术/测试/项目管理/运营）
                 把架构拆解为可执行工作包；
              3. 为每个工作包分配责任部门、主责角色与资源优先级；
              4. 通过 task_scheduler 事件驱动派发，按依赖自动推进部门协作；
              5. 在 Issue 评论中输出工作包拆分表与部门协作依赖图。
              全程机制驱动，无需人工手动推进度。

# ---- 事件驱动：PR 提交 → 「评审→修复」闭环（主触发源，方案 A）----
# 借鉴架构师 Agent 的“测试信号灯”护栏：PR 提交先跑测试断言，
# 未通过即红灯阻塞，不放行后续评审/合并，避免“半成品”进入流水线。
# 这是最主要的触发源：任何修复推送（修完必推）都会触发本流水线重跑，
# 评审若“需修改”则触发本仓库修复专员就地修复并重推，
# 形成天然多轮循环——直到评审通过（无 bug）才停（钩子没 bug 就停）。
  pull_request:
    - name: review-fix-loop
      docker:
        image: *npc_image
      stages:
        - name: 测试信号灯
          script: |
            bash game-studio-agents/tests/test_producer_agent.sh
            bash game-studio-agents/tests/test_instantiator.sh
            bash game-studio-agents/tests/test_end_to_end.sh
            bash game-studio-agents/tests/test_progress_pusher.sh
            bash game-studio-agents/tests/test_instantiated_e2e.sh
            bash game-studio-agents/tests/test_review_fix_loop.sh
            bash game-studio-agents/tests/test_market_input_bridge.sh
            bash game-studio-agents/tests/test_ecosystem_roles.sh
            bash game-studio-agents/tests/test_data_ops_diagnosis.sh
            bash game-studio-agents/tests/test_progress_pusher_fullchain.sh
            bash game-studio-agents/tests/test_release_gate.sh
            bash game-studio-agents/tests/test_merged_confirm_agent.sh
            pip install -q -r game-studio-agents/api/requirements.txt
            bash game-studio-agents/api/test_api.sh
        - name: 自动分配评审人
          type: git:reviewer
          options:
            type: add-reviewer
            count: 1
        - name: NPC 代码审查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是游戏开发项目的资深代码审查员，负责审查各部门提交的代码质量、
              架构合理性、潜在 Bug 与安全漏洞，并给出可落地的改进建议。
            userPrompt: |
              请审查本次 PR 的代码变更，重点检查：
              1. 是否符合 config/roles.yaml 与 config/game_producer_agent.py 的架构约束；
              2. 机制化编排逻辑是否正确（消息总线 / 调度器 / 依赖解锁）；
              3. 是否存在 Bug、安全漏洞或资源泄漏；
              4. 给出"通过 / 需修改"结论及具体修改点。
              在 PR 评论中输出审查结论。
              【修复专员触发机制·评审后闭环】
              5. 若评审结论为"需修改/需改进"：在评论末尾**必须**用
                 「@dongdongxiaozu/youxikaifaxilieagent(仓库修复专员)」完整格式
                 （仓库路径 + 角色名）点名**本仓库的修复专员**，说明已完成的
                 评审结论与需要修复的具体点，触发 `pull_request.comment@npc`
                 让本仓库修复专员接手修复闭环。
                 - **不能用裸 `@CodeBuddy`**（裸 @ 会命中系统级或他仓 CodeBuddy，
                   权限不对无法推送）；
                 - 完整格式定位可确保调取到本仓库专属修复专员（具备推送权限），
                   避免 push 403 导致闭环在"推送"一步静默中断。
        - name: 评审闭环健康检查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是评审闭环健康检查员。在合并门禁前核查本 PR 的「评审→修复→重推」闭环
              是否真正走通，防止"修复推了但评审没跟上"的假完成状态，增强稳定性。
            userPrompt: |
              请核查本次 PR 的评审闭环健康状况（重点防静默中断），**先区分「正常待评审」
              与「真正闭环中断」两种情况，禁止仅因"最新 head 暂无评审结论"就误判中断**：

              A. 正常待评审（应放行，不中断流水线）：本 run 内评审 NPC 已输出评审结论，
                 「需修改」时已用完整格式 @dongdongxiaozu/youxikaifaxilieagent(仓库修复专员)
                 触发 `pull_request.comment@npc` 事件 → 修复专员在该事件中修复并 push
                 → 修复 push 会触发**下一轮** pull_request 评审 run。此刻本 run 拿不到最新
                 head 的评审结论是**正常状态**。若本次 head 的评审结论尚未产生，但已确认
                 @ 召唤已正确发出且触发链路正常，即视为闭环正常推进，放行等下一轮跟进，
                 不得中断；

              B. 真正闭环中断（须满足**至少一个硬性信号**，否则不算中断）：
                 - 推送失败：push 返回 403（身份非本仓库修复专员 / 执行 agent 权限不足），
                   且修复根本没推上去；
                 - 推送成功但长时间（超时阈值）无任何后续评审 run 跟进；
                 - 评审结论长期停留在"需修改"且超过 10 轮上限仍未收敛。
                 满足任一信号才显式输出"评审闭环中断"告警，说明中断环节（推送 / 评审触发 /
                 评审结论）与处置建议（**用「仓库路径(角色名)」完整格式定位本仓库修复专员
                 代推，不做补权限**），并中断流水线返回失败，不放行合并；

              4. 若闭环正常且已有评审结论：进入合并门禁校验。
        - name: 合并门禁检查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是合并门禁把关人。pull_request.mergeable 只代表代码可合并，
              不代表评审已通过。你的职责是在自动合并前校验评审门禁。
            userPrompt: |
              本次 PR 已完成评审-修复闭环。请在校验后才放行自动合并：
              1. 检查本 PR 的评审状态是否为 approved；
              2. 检查是否存在 changes_requested / 未解决的打回评论；
              3. 只有评审通过且无未解决阻塞项时，才输出“放行”并结束本阶段；
              4. 若评审未通过或存在打回项，必须中断流水线（返回失败），
                 禁止自动合并，等待打回修复后再走门禁。

# ---- 事件驱动：PR 可合并 → 自动合并（满足门禁后无需人工）----
# 说明: pull_request.mergeable 只代表“代码可合并”（无冲突/CI 通过），
#      不代表“评审已通过”。因此在 auto-merge 之前增加一道“评审门禁”，
#      由代码审查员 NPC 校验，只有评审通过才放行自动合并。
  pull_request.mergeable:
    - name: auto-merge
      docker:
        image: *npc_image
      stages:
        - name: 合并门禁检查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是合并门禁把关人。pull_request.mergeable 只代表代码可合并，
              不代表评审已通过。你的职责是在自动合并前校验评审门禁。
            userPrompt: |
              本次 PR 已达到可合并条件，请在校验后才放行自动合并：
              1. 检查本 PR 的评审状态是否为 approved；
              2. 检查是否存在 changes_requested / 未解决的打回评论；
              3. 只有评审通过且无未解决阻塞项时，才输出“放行”并结束本阶段；
              4. 若评审未通过或存在打回项，必须中断流水线（返回失败），
                 禁止自动合并，等待打回修复后再走门禁。
        - name: 自动合并
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true

# ---- 事件驱动：PR 合并后 → 自动更新 Issue 并解锁下游 ----
  pull_request.merged:
    - name: post-merge-orchestrate
      docker:
        image: *npc_image
      stages:
        - name: 合并后联动
          type: npc:go
          options:
            role: 游戏向经理
            systemPrompt: |
              你是游戏开发项目的"游戏向经理"，负责在 PR 合并后自动推进后续部门工作。
            userPrompt: |
              本次 PR 已合并，请作为游戏向经理：
              1. 分析合并后的新代码对各部门工作包的影响；
              2. 解锁依赖本 PR 产出的下游部门工作包并自动派发；
              3. 更新对应 Issue 状态（标注进展/下一阶段）；
              4. 在 Issue 中评论合并后的下一步协作计划。
              全程机制驱动，无需人工手动推进度。

# ---- 触发源 2：人工评审者以 git「需要改进」形式打回 → 召唤本仓库修复专员 ----
# 兼容场景：人类评审人在评审界面对 PR 提交「changes_requested」（需要改进）结论时触发。
# 这是人工 git 级打回的触发源，与 pull_request（主闭环）并存互补，不互相替换。
  pull_request.changes_requested:
    - name: auto-fix-review
      docker:
        image: *npc_image
      stages:
        - name: 召唤本仓库修复专员
          type: npc:go
          options:
            role: 触发调度员
            systemPrompt: |
              你是评审触发调度员。收到 PR 被人工评审打回（changes requested）信号时，
              负责在 PR 评论中召唤**本仓库的修复专员**来执行修复，不直接修改代码。
              你的职责是精准调度——用「仓库路径(角色名)」完整格式定位本仓库修复专员。
            userPrompt: |
              本次 PR 被评审打回（changes requested）。请作为触发调度员执行：
              1. 读取评审打回意见与行级评论；
              2. **必须**用「@dongdongxiaozu/youxikaifaxilieagent(仓库修复专员)」
                 完整格式（仓库路径 + 角色名）召唤**本仓库的修复专员**，在 PR 评论中
                 明确说明打回原因、需要修复的具体点与行级定位，触发
                 `pull_request.comment@npc` 让本仓库修复专员接手执行修复与推送；
                 - **不能用裸 `@CodeBuddy`**（裸 @ 会命中系统级或他仓 CodeBuddy，
                   权限不对无法推送）；
                 - 必须用完整格式定位本仓库修复专员，确保稳定触发同仓库而非通用 CodeBuddy；
              3. 输出召唤后结束本阶段，不直接修改代码；
              4. 由本仓库修复专员在 `pull_request.comment@npc` 事件中读取本评论的
                 召唤指令与评审打回内容，执行修复、补断言并 push。
              全程机制驱动。

# ---- 触发源 3：人类/评审 NPC @ 本仓库修复专员 点名驱动（修复执行入口）----
# 说明: 这是**唯一**具备推送权限的修复执行入口（用户开启"替我上班"后 CNB_TOKEN
#       具备 repo-code:rw）。所有评审后需修复的场景都统一通过本事件触发：
#         - pull_request 事件中评审 NPC 输出需修改 → @本仓库修复专员触发本事件；
#         - changes_requested 事件中调度员输出需修改 → @本仓库修复专员触发本事件；
#         - 人类主动在 PR 评论中 @本仓库修复专员 → 触发本事件。
#   role: 仓库修复专员（settings.yml 中定义的独特角色名，避免与系统内置 CodeBuddy 混淆）。
  pull_request.comment@npc:
    - name: npc-manual-invoke
      docker:
        image: *npc_image
      stages:
        - name: 仓库修复专员按 @ 指令处理
          type: npc:go
          options:
            role: 仓库修复专员
            systemPrompt: |
              你是**本仓库专属**的代码修复 Agent（仓库修复专员），**具备本仓库的推送、
              合并 PR、关闭 Issue 等全部操作权限**。与评审 NPC（仅读和审，不操作）
              严格区分。人类或评审 NPC 在 PR 评论中 @你，请按指令处理，并遵循
              "评审-修复闭环护栏"（docs/评审修复闭环护栏.md）：默认直接改、
              最大 10 轮、每修一点补断言、超限或无法就地解决时反馈人类/转交。
              你是「dongdongxiaozu/youxikaifaxilieagent(仓库修复专员)」，通过完整
              仓库路径+角色名定位到本仓库专属修复 Agent。
            userPrompt: |
              你在 PR 评论中被 @ 召唤（可能是人类或评审 NPC 触发）。请按评论内容执行：
              1. 若指令是要求修复评审问题（通常来自评审 NPC 或人工评审的 @ 召唤）：
                 - 读取 @ 召唤评论中的评审打回意见与行级定位；
                 - 默认直接改，在 PR 源分支修改并 push，补断言，检查轮次上限；
                 - push 成功后确认触发新一轮 pull_request 评审，继续闭环；
                 - 若 push 403：说明调用身份不对，不做补权限，在评论中显式告警。
              2. 若指令是询问/探讨（如机制设计、选型）：直接给出分析与结论，
                 不修改代码；
              3. 若指令是要求落地某机制（如多源触发）：按指令修改 .cnb.yml 或文档
                并在 PR 源分支提交；
              4. 若问题无法在本 PR 就地解决：说明转交其他 issue/PR 或做文档性提交。
              全程机制驱动。

# ---- 合并标签确认机制（类似审查机制，探查合并标签 issue 个数）----
# 说明: 定时探查仓库中带「已合并」标签但状态仍为 open 的 Issue，
#       若数量 > 0 则触发「合并确认员」NPC 逐个确认：
#         - 已合并且无后续任务 → 关闭 Issue；
#         - 已合并但有明确后续任务（未派发）→ 新建 Issue 承接并分配任务，关闭原 Issue；
#         - 已合并但仍有阻塞/待复核/依赖未收尾 → 保留 Issue。
#   实现: config/merged_confirm_agent.py（探查 probe / 确认 confirm / 决策 decide）
#   crontab 事件必须放在具体分支名下（此处放 main）。
#   频率: 每天 06:00 Asia/Shanghai（可调整 cron 表达式）
main:
  "crontab: 0 6 * * *":
    - name: merged-confirm-sweep
      docker:
        image: *npc_image
      stages:
        # 阶段名保持与职责一致：此处仅运行 __main__ 自测（冒烟），
        # 不执行真实探查；真实探查由下一阶段 npc:go「合并确认员」通过 CNB API 完成。
        - name: 自测冒烟
          script: |
            cd game-studio-agents
            echo "== 合并确认 Agent 自测冒烟（不执行真实探查）=="
            python3 config/merged_confirm_agent.py
        - name: 合并确认员逐个确认
          type: npc:go
          options:
            role: 合并确认员
            systemPrompt: |
              你是「合并确认员」（Merged Confirmer）。负责对仓库中已打上「已合并」
              标签但仍处于 open 状态的 Issue 做工作内容确认——判断当前对话是否还有
              内容需要推进，还是已适合关闭。你独立于修复专员，专责确认环节。
              使用 config/merged_confirm_agent.py 的探查/确认/决策逻辑。
            userPrompt: |
              请执行合并标签确认工作流：
              1. 使用 CNB API 探查仓库中带「已合并」相关标签（如「安全加固已合并」
                 「经理编排已合并」「预设体系已合并」「生态角色体系已合并」等）且
                 状态仍为 open 的 Issue，统计数量 N；
              2. 若 N == 0：说明无待确认 Issue，在本流水线日志输出「无需确认」并结束；
              3. 若 N > 0：逐个确认每个候选 Issue——读取其标题/描述/标签/评论历史，
                 判断是否有待推进内容：
                 - 已合并且无后续任务（下游已由新 Issue 承接）→ 关闭该 Issue，
                   在 Issue 评论输出确认结论「工作已完成，已合并，关闭」；
                 - 已合并但有明确后续任务（未派发）→ 新建 Issue 承接该后续任务并
                   分配处理人，然后关闭原 Issue，在原 Issue 评论说明「后续已派发到
                   #新Issue」；
                 - 已合并但仍有阻塞/待复核/依赖未收尾 → 保留 Issue，在评论说明
                   「仍待推进」原因；
              4. 在探查到的最新 Issue 上（或本流水线日志）汇总输出确认结果表。
              5. 【防静默失效·强制自检】每次执行关闭 Issue / 新建 Issue / 评论回写
                 等写操作后，必须核验 CNB API 实际返回结果：
                 - 若操作成功（HTTP 200）：确认在日志与评论中记录实际结果；
                 - 若操作失败（非 200 / 返回错误码）：**不得静默吞掉**，必须在本
                   流水线日志与 PR/Issue 评论中显式告警 @ 仓库负责人，说明失败环节、
                   失败原因与处置建议（如检查 NPC 身份/权限配置）；
                 - N==0 时仍需验证探查 API 调用本身成功（HTTP 200 且有数据返回），
                   若探查本身失败（403/超时/返回异常），同样需要显式告警而非输出
                   「无需确认」；
              6. 若因身份/权限不足导致写操作全部失败，停止后续操作并汇总告警，
                 禁止把「操作失败」吞成「无需确认」。
              全程机制驱动，无需人工推进。
              注意：不要合并/修改代码，只做 Issue 状态确认与派发。
