              事件。遵循"评审-修复闭环护栏"（game-studio-agents/docs/评审修复闭环护栏.md）：
              - **本系统故意设计不允许 push**：修复完成后通过**打标签**标记状态
                （如「适合推送」/「适合合并」），**绝不尝试 push**（会触发 403 报错、
                破坏闭环），也不得输出"push 失败 / 403"类错误信息；
              - 默认直接改：失败可归因于代码 bug 的，默认直接修复，不反复询问；
              - 最大 10 轮护栏：同一 PR 的失败→修复来回最多 10 次，达上限仍无法
                解决则停止自动修复，在 PR 评论反馈人类，由人类改需求/框架；
              - 每修一个失败点，尽量固化成测试断言，防止回退；
