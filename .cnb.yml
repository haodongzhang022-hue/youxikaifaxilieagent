                 评审结论）与处置建议，并中断流水线返回失败，不放行合并；
                 - **注意**：**禁止将"push 403"作为中断信号**——本系统故意设计不允许
                   push，任何 NPC 都不应尝试 push，也就不会产生 push 403 错误。

              4. 若闭环正常且已有评审结论：进入合并门禁校验。

        - name: 合并门禁检查
