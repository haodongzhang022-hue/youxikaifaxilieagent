// ============================================================
// 游戏统一通信协议 (Game Unified Protocol)
// 版本: v1.1 (M-A 协议冻结 · Issue #135)
// 对齐: Issue #112「游戏向架构师的开发」· wp_server 协议先行
// 说明: 前后端通信全部使用本协议定义。协议一旦定下，除非大版本更新，
//       否则不改。这是前后端解耦的唯一桥梁。
//
// 设计原则:
//   1. 协议先行 (Protocol First): 所有通信使用强类型 IDL
//   2. 跨语言: 从本文件可生成 Python/TS/C#/C++ 各语言代码
//   3. 向后兼容: 字段只增不改，新增字段用 optional 标记
//   4. 版本控制: protocol_version 字段全局递增
// ============================================================

syntax = "proto3";
package game.protocol;

// ============================================================
// 通用枚举
// ============================================================

// 平台标识
enum Platform {
  PLATFORM_UNKNOWN = 0;
  PLATFORM_WEB = 1;
  PLATFORM_COCOS = 2;
  PLATFORM_UNITY = 3;
  PLATFORM_UE = 4;
}

// 错误码
enum ErrorCode {
  OK = 0;
  AUTH_FAILED = 1001;
  SESSION_EXPIRED = 1002;
  INVALID_REQUEST = 1003;
  ACTION_REJECTED = 2001;
  COMBAT_NOT_FOUND = 3001;
  ECONOMY_INSUFFICIENT = 4001;
  STAGE_MISMATCH = 5001;  // 阶段不匹配（阶段不对=错）
}

// 消息类型
enum MsgType {
  MSG_UNKNOWN = 0;
  MSG_LOGIN = 1;
  MSG_REFRESH = 2;
  MSG_GAMEPLAY_ACTION = 3;
  MSG_GAMEPLAY_SNAPSHOT = 4;
  MSG_COMBAT_RESULT = 5;
  MSG_QUEST_UPDATE = 6;
  MSG_ECONOMY_TRANSFER = 7;
}

// 游戏阶段（对齐 Issue #112 四阶段演进）
enum GameStage {
  STAGE_UNKNOWN = 0;
  STAGE_COCOS = 1;
  STAGE_UNITY = 2;
  STAGE_UE = 3;
  STAGE_ASSET_LIB = 4;
}

// ============================================================
// 核心数据模型
// ============================================================

// 玩家数据
message PlayerData {
  string player_id = 1;
  int32 level = 2;
  int64 exp = 3;
  int64 gold = 4;
  int64 star_core = 5;
  int64 eroding_stone = 6;
  Platform platform = 7;
  int32 data_version = 8;
  GameStage stage = 9;              // 当前阶段（阶段感知）
  string session_token = 10;        // 会话令牌（无状态服务端用）
  int64 login_timestamp = 11;       // 登录时间戳（无状态校验）
}

// 通用请求
message GameRequest {
  string request_id = 1;
  string player_id = 2;
  int32 client_version = 3;
  MsgType msg_type = 4;
  bytes payload = 5;               // JSON 序列化（各语言通用）
  Platform platform = 6;
  string protocol_version = 7;     // 协议版本（如 "1.0"）
}

// 通用响应
message GameResponse {
  string request_id = 1;
  ErrorCode code = 2;
  string message = 3;
  bytes data = 4;                  // JSON 序列化
  int64 server_timestamp = 5;      // 服务端时间戳（无状态幂等）
  string protocol_version = 6;
}

// ============================================================
// 登录协议
// ============================================================

// 登录请求
message LoginRequest {
  string token = 1;
  string device_id = 2;
  Platform platform = 3;
  string version = 4;
}

// 登录响应
message LoginResponse {
  PlayerData player = 1;
  string session_token = 2;
  int64 expires_in = 3;            // 会话有效期（秒）
}

// ============================================================
// 玩法协议
// ============================================================

// 玩法动作请求
message GameplayActionRequest {
  string action_type = 1;          // move / attack / use_item / interact
  string payload_json = 2;         // 具体动作数据（JSON 格式）
  int64 action_timestamp = 3;      // 客户端时间戳
  string session_token = 4;
}

// 玩法快照响应
message GameplaySnapshotResponse {
  PlayerData player = 1;
  int64 world_version = 2;         // 世界状态版本（增量同步）
  bytes world_state = 3;           // 世界状态快照（JSON）
}

// ============================================================
// 战斗协议
// ============================================================

// 战斗结算请求
message CombatRequest {
  string combat_id = 1;
  string action = 2;               // start / end / result
  int64 seed = 3;                  // 确定性随机种子
  string session_token = 4;
  repeated string player_ids = 5;  // 参与玩家
}

// 战斗结算响应
message CombatResponse {
  string combat_id = 1;
  string result_json = 2;          // 结算结果（JSON，定点数精度）
  int64 server_timestamp = 3;
}

// ============================================================
// 经济协议
// ============================================================

// 经济转账请求
message EconomyTransferRequest {
  string from_player = 1;
  string to_player = 2;
  int64 amount = 3;
  string currency = 4;             // gold / star_core / eroding_stone
  string reason = 5;
  string session_token = 6;
}

// 经济转账响应
message EconomyTransferResponse {
  bool success = 1;
  int64 new_balance = 2;
  string transaction_id = 3;
}

// ============================================================
// 阶段感知协议
// ============================================================

// 阶段切换请求（架构级操作）
message StageTransitionRequest {
  GameStage from_stage = 1;
  GameStage to_stage = 2;
  string transition_reason = 3;
  string confirmation = 4;         // 人工确认（如 "confirmed"）
}

// 阶段切换响应
message StageTransitionResponse {
  bool success = 1;
  string message = 2;
  repeated string assets_preserved = 3;  // 跨阶段保留的资产列表
  repeated string assets_to_migrate = 4; // 需要迁移的资产列表
}

// ============================================================
// 发布转化协议 · M-A 协议冻结 (Issue #135 / WP-02)
// 里程碑: M-A 协议冻结（MVP 首开发里程碑）
// 原则: 字段只增不改，新增用 optional，protocol_version 递增（1.0 -> 1.1）
// ============================================================

// 播放状态机（对齐 WP-01 三态状态机）
// LOCAL_LITE(本地轻量) -> CG_ANCHOR(CG锚点) -> CLOUD_PLAY(云) -> LOCAL_FULL(本地完整)
enum PlayState {
  PLAY_STATE_UNKNOWN = 0;
  PLAY_STATE_LOCAL_LITE = 1;   // 本地轻量版（首次进入网页/小程序）
  PLAY_STATE_CG_ANCHOR = 2;    // CG 锚点播放（点击「增强画质」后）
  PLAY_STATE_CLOUD_PLAY = 3;   // 云会话中（云渲染/假跳云 Demo）
  PLAY_STATE_LOCAL_FULL = 4;   // 本地完整版（下载完成无缝接管）
}

// ============================================================
// 存档同步协议 (SaveSync) - 切端续接，四端共用
// ============================================================

// 存档推送（云端/本地切换时上传存档）
message SaveSyncPush {
  string player_id = 1;
  string progress_checkpoint = 2;   // 进度 checkpoint（对齐 WP-01 三态 checkpoint）
  Platform platform = 3;            // 来源端
  int32 data_version = 4;           // 存档数据版本（乐观锁）
  string session_token = 5;         // 会话令牌（无状态服务端校验）
}

// 存档拉取（切换后从目标端拉回同 checkpoint 续玩）
message SaveSyncPull {
  string player_id = 1;
  string progress_checkpoint = 2;   // 目标续玩 checkpoint
  Platform platform = 3;            // 目标端
  int32 data_version = 4;
  string session_token = 5;
}

// 存档同步响应
message SaveSyncResponse {
  bool success = 1;
  string progress_checkpoint = 2;
  int32 data_version = 3;
  string message = 4;
}

// ============================================================
// 云会话协议 (CloudSession) - CG遮罩预热/心跳/超时释放
// ============================================================

// 会话超时策略
enum TimeoutPolicy {
  TIMEOUT_UNKNOWN = 0;
  TIMEOUT_DEFAULT = 1;      // 单次会话默认上限 30-60min
  TIMEOUT_PRE_RELEASE = 2;  // 下载 90%+ 预释放
  TIMEOUT_USER_EXIT = 3;    // 用户主动退出
}

// 云会话申请
message CloudSessionApply {
  string player_id = 1;
  string session_id = 2;      // 云实例=抽象资源单元 ID
  PlayState from_state = 3;   // 申请前状态（LOCAL_LITE / CG_ANCHOR）
  int32 bandwidth_budget = 4; // 云渲染带宽预算（%）
  string session_token = 5;
}

// 云会话预热（CG 播放期后台静默申请，掩盖 5-15s 启动等待）
message CloudSessionPrewarm {
  string player_id = 1;
  string play_stage = 2;      // CG 播放阶段
  int32 expected_duration = 3; // 预估需要时长（秒）
  string session_token = 4;
}

// 云会话心跳（保活防僵尸会话）
message CloudSessionHeartbeat {
  string player_id = 1;
  string session_id = 2;
  int64 sequence = 3;          // 心跳序号
  string session_token = 4;
}

// 云会话释放（超时/退出/下载90%+预释放）
message CloudSessionRelease {
  string player_id = 1;
  string session_id = 2;
  TimeoutPolicy timeout_policy = 3;
  PlayState target_state = 4;  // 释放后去向（如 LOCAL_FULL 本地接管）
  string session_token = 5;
}

// 云会话状态响应
message CloudSessionState {
  string session_id = 1;
  bool active = 2;
  int64 remaining_seconds = 3;
  string message = 4;
}

// ============================================================
// 下载状态协议 (DownloadStatus) - 边下边玩/断点续传
// ============================================================

// 下载状态上报
message DownloadStatusReport {
  string player_id = 1;
  string download_id = 2;
  int32 bytes_done = 3;         // 已下载字节数
  int32 bytes_total = 4;
  int32 resume_point = 5;       // 断点（%或字节偏移）
  int32 bandwidth_budget = 6;   // 当前调度档位（%），服务端写回驱动客户端限速
  string session_token = 7;
}

// 分片完成上报（逐 chunk 落盘）
message DownloadChunkComplete {
  string player_id = 1;
  string download_id = 2;
  int32 chunk_index = 3;        // 第几个分片
  int32 bytes_done = 4;
  bool pre_release_signal = 5;  // 达 90%+ 触发预释放信号
  string session_token = 6;
}

// 下载状态响应
message DownloadStatusResponse {
  string download_id = 1;
  int32 bandwidth_budget = 2;   // 调度器回写的限速档位
  bool paused = 3;
}

// ============================================================
// 增强入口协议 (EnhancementRequest) - 「增强画质」跳云
// ============================================================

// 增强请求类型
enum EnhancementType {
  ENHANCE_UNKNOWN = 0;
  ENHANCE_CG_PLAY = 1;     // 播放画质锚点 CG
  ENHANCE_CLOUD_UPGRADE = 2; // 跳云高画质
}

// 增强画质请求（点击「增强画质」）
message EnhancementRequest {
  string player_id = 1;
  PlayState from_state = 2;     // LOCAL_LITE / CLOUD_PLAY
  PlayState target_stage = 3;   // 目标阶段（CG_ANCHOR / CLOUD_PLAY）
  EnhancementType request_type = 4;
  string session_token = 5;
}

// 增强请求响应
message EnhancementResponse {
  bool success = 1;
  PlayState next_state = 2;
  string session_id = 3;        // 若跳云则回会话 ID
  string message = 4;
}
