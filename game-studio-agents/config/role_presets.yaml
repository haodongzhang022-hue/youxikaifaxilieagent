# ============================================================
# 角色分层预设体系（Role Preset System）
# 版本: v0.1
# 说明: 本文件是"备用预设"，与 roles.yaml 中的"正式角色"解耦。
#       为具备可扩展性，无需把每种可能直接做成正式角色（≥3个会过度膨胀），
#       而是以"分层预设 + 按需启用"的方式，为同一岗位/岗位族储备多种变体。
#       相同岗位（如美工）的不同美术风格、不同技术栈、不同生态小组，
#       都可以作为预设预置进来，需要时再启用（enable: true 或实例化为正式角色）。
#
# 分层设计（Level）:
#   L1 角色级预设 (role_preset)  —— 针对单个岗位的变体（风格/技术栈/侧重）
#   L2 技术栈级预设 (stack_preset) —— 针对程序线岗位的技术栈方案（UE5/Godot/Web/页面引擎...）
#   L3 小组级预设 (team_preset)  —— 面向某一生态/技术栈组织起来的小组（UE5小组/Godot小组/Web前端小组...）
#
# 启用方式:
#   1. 只读参考: 读取本文件，把对应 preset 字段并入某正式角色
#   2. 按需实例化: 把某个 preset 复制为 roles.yaml 中的正式角色（role_id 加后缀），
#      status 设为 "agent_enabled" 即可参与调度
#   3. 小组编排: 通过 team_preset 组合多个 role/stack preset，作为一组 Agent 整体启用
#
# 约定: 所有预设默认 status: "preset_standby"（备用未启用）。
#       预设为"轻量定义"，只给差异化字段（personality/风格/技术栈/工具链/侧重），
#       不重复展开 responsibilities/tasks（复用 base_role 的正式定义），
#       这是为支持"无需研究>3个角色"的可扩展性。
# ============================================================

preset_system:
  name: "role-layered-presets"
  version: "0.1.0"
  description: "角色分层备用预设：角色级 / 技术栈级 / 小组级，按需启用"
  convention:
    - "默认 status = preset_standby（备用未启用）"
    - "轻量定义：只给差异化字段，复用 base_role 的正式定义（responsibilities/tasks/状态机）"
    - "启用 = 实例化为正式角色或并入现有角色；不强制每个预设都做完整研究"

# ============================================================
# L1 角色级预设（同一岗位的变体）
#   以 base_role 为锚点，提供多种风格/侧重/技术栈的备用变体。
# ============================================================
role_presets:

  # ---------------- 美工类 · 美术风格预设 ----------------
  - preset_id: "art_style_pixel"
    base_role: "concept_artist"          # 锚定正式角色（原画师）
    level: "L1"
    status: "preset_standby"
    category: "art_style"
    name: "原画师（像素风）"
    personality: "像素考究：以像素密度与调色板为语言，追求复古情怀与辨识度，风格克制讲究，擅长在有限像素内表达形体与情绪。"
    preset_fields:
      art_style: "pixel"
      color_palette: "limited (16-64色)"
      visual_signature: "复古像素 + 高饱和霓虹点缀"
      applies_to: "复古/横版/独立/低端机型项目"

  - preset_id: "art_style_inkwash"
    base_role: "concept_artist"
    level: "L1"
    status: "preset_standby"
    category: "art_style"
    name: "原画师（水墨风）"
    personality: "水墨写意：以留白与笔势见长，追求东方意境与画面气韵，风格空灵雅致，擅长用浓淡干湿营造氛围。"
    preset_fields:
      art_style: "ink_wash"
      color_palette: "黑白灰 + 点缀朱砂"
      visual_signature: "东方意境 + 留白气韵"
      applies_to: "国风/仙侠/武侠/文艺类项目"

  - preset_id: "art_style_cyberpunk"
    base_role: "concept_artist"
    level: "L1"
    status: "preset_standby"
    category: "art_style"
    name: "原画师（赛博朋克风）"
    personality: "赛博视觉：以霓虹、故障美学与高反差为语言，追求未来都市的冷峻与电子感，风格浓烈先锋，擅长营造技术奇观。"
    preset_fields:
      art_style: "cyberpunk"
      color_palette: "霓虹紫/青/洋红 高对比"
      visual_signature: "故障艺术 + 全息霓虹 + 高反差"
      applies_to: "科幻/赛博朋克/近未来项目"

  - preset_id: "art_style_lowpoly"
    base_role: "modeler"
    level: "L1"
    status: "preset_standby"
    category: "art_style"
    name: "3D建模师（低多边形风）"
    personality: "几何概括：以低面数与平面色块塑造形体，追求几何美与风格统一，风格利落明快，擅长用最少面数营造独特画风。"
    preset_fields:
      art_style: "low_poly"
      poly_budget: "低面数（1000-5000）/角色"
      visual_signature: "几何块面 + 柔和光影"
      applies_to: "休闲/移动端/极简风格项目"

  - preset_id: "art_style_cel"
    base_role: "vfx_artist"
    level: "L1"
    status: "preset_standby"
    category: "art_style"
    name: "特效师（日系卡通风）"
    personality: "二次元表现：以卡渲/描边/高饱和粒子为语言，追求漫画式的爽快与华丽，风格明快张扬，擅长营造中二爆发的演出感。"
    preset_fields:
      art_style: "cel_shading"
      visual_signature: "描边卡渲 + 高饱和粒子 + 速度线"
      applies_to: "日系/二次元/卡通风项目"

  # ---------------- 策划类 · 玩法侧重预设 ----------------
  - preset_id: "design_focus_roguelike"
    base_role: "system_designer"
    level: "L1"
    status: "preset_standby"
    category: "design_focus"
    name: "系统策划（肉鸽向）"
    personality: "随机构筑：以随机性与构筑深度为核心，擅长设计道具组合、关卡洗牌与Build循环，风格策略缜密，追求每次开局的新鲜感。"
    preset_fields:
      focus: "roguelike"
      systems: ["随机关卡", "道具/词条Build", "死亡循环", "局外成长"]
      applies_to: "肉鸽/卡牌构筑/多周目项目"

  - preset_id: "design_focus_survival"
    base_role: "balance_designer"
    level: "L1"
    status: "preset_standby"
    category: "design_focus"
    name: "数值策划（生存经营向）"
    personality: "资源循环：以产出-消耗-稀缺为核心，擅长设计生存压力与经营平衡，风格精算克制，追求紧平衡下的策略张力。"
    preset_fields:
      focus: "survival_management"
      loops: ["资源产出", "生存消耗", "科技/建筑解锁", "稀缺/压力曲线"]
      applies_to: "生存/经营/放置/模拟项目"

  # ---------------- 技术类 · 技术栈预设 ----------------
  - preset_id: "tech_client_ue5"
    base_role: "client_dev"
    level: "L1"
    status: "preset_standby"
    category: "tech_stack"
    name: "客户端程序员（UE5）"
    personality: "UE5深耕：熟悉虚幻引擎生态，擅长GAS/蓝图/C++与次世代渲染，风格扎实工程化，追求引擎能力的最大化利用。"
    preset_fields:
      tech_stack: "Unreal Engine 5"
      key_skills: ["C++", "Blueprints", "GAS(游戏性框架)", "Niagara", "Lumen/ Nanite", "UMG"]
      workflows: ["引擎内开发", "蓝图+C++混合", "引擎版本升级适配"]

  - preset_id: "tech_client_godot"
    base_role: "client_dev"
    level: "L1"
    status: "preset_standby"
    category: "tech_stack"
    name: "客户端程序员（Godot）"
    personality: "Godot轻快：偏好开源轻量引擎，擅长GDScript与节点体系，风格敏捷高效，追求低成本快速原型与跨平台轻交付。"
    preset_fields:
      tech_stack: "Godot Engine"
      key_skills: ["GDScript", "Scene/Node体系", "Signals", "跨平台导出", "轻量2D/3D渲染"]
      workflows: ["场景化开发", "信号驱动", "轻量构建"]

  - preset_id: "tech_web_react"
    base_role: "client_dev"
    level: "L1"
    status: "preset_standby"
    category: "tech_stack"
    name: "Web前端程序员（React）"
    personality: "Web交互：以浏览器与WebGL为阵地，擅长React生态与前端游戏化交互，风格组件化清晰，追求跨端一致与高可维护性。"
    preset_fields:
      tech_stack: "Web (React)"
      key_skills: ["React", "TypeScript", "Three.js / WebGL", "状态管理", "PWA", "跨端响应式"]
      workflows: ["组件化开发", "WebGL渲染", "浏览器调试与性能"]

  - preset_id: "tech_web_engine"
    base_role: "client_dev"
    level: "L1"
    status: "preset_standby"
    category: "tech_stack"
    name: "Web游戏程序员（页面引擎）"
    personality: "页面引擎：以H5/页面化游戏引擎为主力（如 Cocos / Egret / Laya / Phaser），擅长2D休闲与H5营销小游戏，风格务实快速，追求极短上线周期。"
    preset_fields:
      tech_stack: "页面引擎 (Cocos/Egret/Laya/Phaser)"
      key_skills: ["TypeScript/JS", "2D游戏框架", "H5性能优化", "小游戏平台适配", "营销互动"]
      workflows: ["页面化构建", "小游戏平台打包", "短周期上线"]

  - preset_id: "tech_server_go"
    base_role: "server_dev"
    level: "L1"
    status: "preset_standby"
    category: "tech_stack"
    name: "服务端程序员（Go）"
    personality: "Go高并发：以Go语言为服务端主力，擅长高并发网关与微服务，风格简洁工程化，追求可观测性与稳定吞吐。"
    preset_fields:
      tech_stack: "Go"
      key_skills: ["Goroutine并发", "微服务", "gRPC/HTTP", "消息队列", "容器化部署"]
      workflows: ["微服务拆分", "网关/登录/战斗服", "容器编排"]

  - preset_id: "tech_ai_llm"
    base_role: "ai_programmer"
    level: "L1"
    status: "preset_standby"
    category: "tech_stack"
    name: "游戏AI程序员（LLM/智能体）"
    personality: "大模型驱动：以LLM与智能体(Agent)技术打造动态NPC与智能交互，思维前沿，擅长把大模型能力接入游戏逻辑做角色扮演与动态叙事。"
    preset_fields:
      tech_stack: "LLM / Agent"
      key_skills: ["LLM API接入", "提示词工程", "Agent编排", "知识库RAG", "记忆管理"]
      workflows: ["NPC智能对话", "动态叙事", "智能体决策"]

# ============================================================
# L2 技术栈级预设（针对程序线岗位族，一次性套用的技术方案）
#   可批量套用到 client/server/engine/ai/tools 等岗位。
# ============================================================
stack_presets:

  - preset_id: "stack_ue5_ecosystem"
    level: "L2"
    status: "preset_standby"
    name: "UE5 生态技术栈"
    description: "面向 UE5 大世界/次世代项目的整套程序线技术方案"
    scope_roles: ["client_dev", "engine_dev", "server_dev", "ai_programmer", "tech_artist"]
    tech_stack:
      engine: "Unreal Engine 5"
      language: "C++ / Blueprints"
      rendering: "Lumen(全局光照) / Nanite(虚拟几何) / Niagara(特效)"
      gameplay: "GAS(Gameplay Ability System) / Animation Blueprint"
      networking: "UE Replication / Dedicated Server"
      ai: "UE Behavior Tree / EQS / 智能体扩展"
      art_pipeline: "MetaHuman / 建模-DCC工具链 / HLOD"
      tools: "UE Editor扩展 / 数据驱动(DataTable/DataAsset)"
    team_notes: "适合大世界、写实次世代、主机/PC 3A级项目；人力投入与设备成本高"

  - preset_id: "stack_godot_ecosystem"
    level: "L2"
    status: "preset_standby"
    name: "Godot 生态技术栈"
    description: "面向 Godot 引擎的开源轻量技术方案"
    scope_roles: ["client_dev", "engine_dev", "server_dev", "ai_programmer"]
    tech_stack:
      engine: "Godot Engine"
      language: "GDScript / C# / C++(GDExtension)"
      rendering: "Lightweight 2D/3D / 自定义Shader"
      gameplay: "Scene/Node 体系 / Signals / Resource"
      networking: "WebSocket / 自定义同步(轻量)"
      ai: "Godot AStar / Navigation / 有限状态机"
      art_pipeline: "内置导入管线 / TileMap / 材质资源"
      tools: "编辑器脚本 / 插件生态 / 跨平台导出"
    team_notes: "适合2D、独立游戏、移动端、低成本快速迭代项目；完全开源零授权成本"

  - preset_id: "stack_web_react_ecosystem"
    level: "L2"
    status: "preset_standby"
    name: "Web 前端生态技术栈（React）"
    description: "面向 Web/H5 网页游戏与前端的整套技术方案"
    scope_roles: ["client_dev", "tools_dev", "server_dev", "ai_programmer"]
    tech_stack:
      engine: "浏览器 / WebGL / 前端框架(React)"
      language: "TypeScript / JavaScript"
      rendering: "Three.js / WebGL / Canvas / 2D框架"
      gameplay: "React组件化 / 状态管理 / 游戏循环"
      networking: "WebSocket / HTTP / WebRTC"
      ai: "浏览器端ML / API接入(LLM)"
      art_pipeline: "SVG / 精灵图 / 纹理打包 / WebGL资源"
      tools: "Vite/Webpack / CI构建 / PWA"
    team_notes: "适合网页游戏、H5小游戏、营销互动、跨端产品；迭代快、分发广、无需安装"

  - preset_id: "stack_page_engine_ecosystem"
    level: "L2"
    status: "preset_standby"
    name: "页面化游戏引擎生态（Cocos/Egret/Laya/Phaser）"
    description: "面向 H5/小游戏平台页面化引擎的轻量技术方案"
    scope_roles: ["client_dev", "tools_dev", "server_dev"]
    tech_stack:
      engine: "Cocos Creator / Egret / Laya / Phaser"
      language: "TypeScript / JavaScript"
      rendering: "引擎内置2D渲染 / 少用3D"
      gameplay: "场景/组件 / 资源管理 / 动画系统"
      networking: "WebSocket / HTTP / 平台SDK"
      ai: "简单状态机 / 寻路"
      art_pipeline: "图集打包 / 骨骼动画 / 平台适配"
      tools: "构建发布到小游戏/微信/字节等平台"
    team_notes: "适合H5休闲、小游戏、营销活动、极速上线项目；适配多小游戏平台"

# ============================================================
# L3 小组级预设（面向某一生态/技术栈组织的小组）
#   组合多个角色/技术栈预设，作为一组 Agent 整体启用。
#   每个小组 = 一套可复用的"生态作战小组"，按项目需求选择其一即可。
# ============================================================
team_presets:

  - preset_id: "team_ue5"
    level: "L3"
    status: "preset_standby"
    name: "UE5 生态开发小组"
    description: "专注 UE5 大世界/次世代开发的一整套程序+TA小组"
    tech_stack: "stack_ue5_ecosystem"
    composition:
      - {role: "client_dev",      preset: "tech_client_ue5",  count: 2, note: "客户端(GAS/蓝图/C++)"}
      - {role: "engine_dev",      count: 1, note: "引擎底层/渲染管线"}
      - {role: "server_dev",      preset: "tech_server_go",   count: 1, note: "服务端(Go)或UE Dedicated Server"}
      - {role: "ai_programmer",   count: 1, note: "UE行为树/EQS"}
      - {role: "tech_artist",     count: 1, note: "TA/Shader/资源管线"}
      - {role: "qa_engineer",     count: 1, note: "UE项目专项测试"}
    coordinators:
      - "技术总监（UE5方向）牵头，负责引擎选型与架构"
      - "客户端与服务端通过 UE 网络同步/消息总线协作"
    typical_projects: ["3A主机/PC", "写实次世代", "大世界开放世界", "高质量单机"]
    enable_hint: "项目采用 UE5 时，整体启用该小组并实例化对应角色预设"

  - preset_id: "team_godot"
    level: "L3"
    status: "preset_standby"
    name: "Godot 生态开发小组"
    description: "专注 Godot 开源引擎的轻量开发小组"
    tech_stack: "stack_godot_ecosystem"
    composition:
      - {role: "client_dev",      preset: "tech_client_godot", count: 2, note: "客户端(GDScript/C#)"}
      - {role: "engine_dev",      count: 1, note: "引擎/工具扩展"}
      - {role: "server_dev",      count: 1, note: "服务端(轻量同步)"}
      - {role: "ai_programmer",   count: 1, note: "AStar/状态机AI"}
      - {role: "qa_engineer",     count: 1, note: "多平台适配测试"}
    coordinators:
      - "技术总监（Godot方向）牵头，负责架构与开源组件选型"
      - "客户端与服务端通过轻量同步协议协作"
    typical_projects: ["2D/3D独立游戏", "移动端", "低成本快速迭代", "开源产品"]
    enable_hint: "项目采用 Godot 时启用；零授权成本，适合中小团队"

  - preset_id: "team_web_frontend"
    level: "L3"
    status: "preset_standby"
    name: "Web 前端开发小组（React）"
    description: "专注 Web/网页游戏与前端的开发小组"
    tech_stack: "stack_web_react_ecosystem"
    composition:
      - {role: "client_dev",      preset: "tech_web_react", count: 2, note: "前端(React/WebGL)"}
      - {role: "client_dev",      preset: "tech_web_engine", count: 1, note: "页面化游戏(可选)"}
      - {role: "tools_dev",       count: 1, note: "前端构建/工具链"}
      - {role: "server_dev",      count: 1, note: "Web后端/网关"}
      - {role: "ui_ux",           count: 1, note: "前端交互体验"}
      - {role: "qa_engineer",     count: 1, note: "跨浏览器/跨端测试"}
    coordinators:
      - "技术总监（Web方向）牵头，负责前端架构与性能"
      - "前后端通过 WebSocket/HTTP/消息总线协作"
    typical_projects: ["网页游戏", "H5互动", "营销活动", "跨端产品"]
    enable_hint: "项目为 Web/H5/网页端时启用；迭代快、分发广、免安装"

  - preset_id: "team_page_engine"
    level: "L3"
    status: "preset_standby"
    name: "页面引擎小组（H5/小游戏）"
    description: "专注 H5/小游戏平台页面化引擎的开发小组"
    tech_stack: "stack_page_engine_ecosystem"
    composition:
      - {role: "client_dev",      preset: "tech_web_engine", count: 2, note: "页面引擎(2D)"}
      - {role: "tools_dev",       count: 1, note: "构建/小游戏平台打包"}
      - {role: "server_dev",      count: 1, note: "H5后端/登录/存储"}
      - {role: "qa_engineer",     count: 1, note: "多小游戏平台适配测试"}
      - {role: "game_operator",   count: 1, note: "H5运营/营销活动"}
    coordinators:
      - "技术总监（H5方向）牵头，负责小游戏平台适配"
      - "通过平台SDK + 消息总线与运营/服务端协作"
    typical_projects: ["H5休闲游戏", "微信/字节小游戏", "营销互动", "极速上线项目"]
    enable_hint: "项目为 H5 小游戏/营销活动时启用；短周期、多平台快速分发"

# ============================================================
# 启用/选择指引
# ============================================================
selection_guide:
  how_to_use: "按项目技术栈与美术风格，选择对应层级预设，按需启用。"
  steps:
    - "1. 判断项目类型（次世代3A / 独立 / 网页 / H5小游戏）与美术风格（写实/卡通/水墨/像素...）"
    - "2. 技术类项目：优先从 L2 stack_presets 选技术栈，再从 L3 team_presets 选对应开发小组整体启用"
    - "3. 美术风格类需求：从 L1 role_presets 选 art_style 预设，并入对应美工角色或实例化"
    - "4. 玩法侧重类需求：从 L1 role_presets 选 design_focus 预设，并入对应策划角色"
    - "5. 启用方式：把 preset 字段并入正式角色，或将 preset 实例化为 roles.yaml 中的正式角色(status=agent_enabled)"
  extensibility_note: "无需把每种风格/技术栈都做成正式角色（>3个会过度膨胀），本预设体系天然支持横向扩展：新增 preset 即新增一种可启用能力，改造成本低、可按项目组合启用。"
