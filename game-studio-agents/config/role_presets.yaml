# ============================================================
# 启用/选择指引
# ============================================================
selection_guide:
  how_to_use: "按项目技术栈、美术风格、玩法侧重与项目类型，选择对应层级预设，按需启用。"
  steps:
    - "1. 判断项目类型（次世代3A / 独立 / 移动端 / 网页 / H5小游戏 / VR-AR）与美术风格（写实/卡通/水墨/像素/体素/扁平/蒸汽朋克/哥特...）"
    - "2. 技术类项目：优先从 L2 stack_presets 选技术栈（UE5/Unity/Godot/Web/页面引擎/AI/数据云原生/Node/Rust/原生移动端...），再从 L3 team_presets 选对应开发小组整体启用"
    - "3. 美术风格类需求：从 L1 role_presets 选 art_style 预设（像素/水墨/赛博朋克/PBR/Toon/体素/扁平/2.5D/剪影/蒸汽朋克/水彩/哥特/街机/Q版/黑色电影/手绘/剪纸...），并入对应美工角色或实例化"
    - "4. 玩法侧重类需求：从 L1 role_presets 选 design_focus 预设（肉鸽/生存/开放世界/射击/卡牌/MOBA/派对/塔防/叙事/解谜/竞速/音律/放置/模拟/大逃杀/社交...），并入对应策划角色"
    - "5. 技术栈类需求：从 L1 role_presets 选 tech_stack 预设（UE5/Unity/Godot/React/Vue/页面引擎/Go/Java/Node/Python/Rust/渲染/数据/云原生/AI/音频/测试自动化/原生移动端...），并入对应技术角色"
    - "6. 项目类型/产品阶段类需求：从 project_type_presets.yaml 选 project_type 预设（手游/PC/主机/小游戏/长线运营/VR-AR...）与 phase 预设（原型/上线/长线），整组套用"
    - "7. 启用方式：把 preset 字段并入正式角色，或将 preset 实例化为 roles.yaml 中的正式角色(status=agent_enabled)，或整组启用 team_preset"
  extensibility_note: "无需把每种风格/技术栈都做成正式角色（>3个会过度膨胀），本预设体系天然支持横向扩展：新增 preset 即新增一种可启用能力，改造成本低、可按项目组合启用。"
