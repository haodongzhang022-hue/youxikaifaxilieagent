# ============================================================
# 进度督导（Progress Pusher）策略声明文件
# 版本: v1.0
# 说明: 把"进度督导"的行为策略（阈值/节奏/打扰成本/升级规则）从代码中
#       抽离为可调参数。**改这里即可调整行为，无需改代码**，保证"稳定"。
# 归属: 协作支持圈 · 进度督导（role_id: progress_pusher）
# 加载: config/progress_pusher.py 的 ProgressPusherAgent 启动时读取
# ============================================================

progress_pusher_policy:
  # ── 身份 ──
  role_id: "progress_pusher"
  name: "进度督导"
  version: "1.0.0"
  enabled: true                 # 关闭则督导进入观察态，不主动催办

  # ── 落后判定（决定是否 PUSH）──
  lag_threshold_days: 2.0       # 逾期 >= 该天数(天) 且未完成 → 判定为"落后"并催办
  near_ddl_warn_hours: 12.0     # 距离 DDL 不足该小时数且未完成 → 提前预警(友好提醒)

  # ── 升级判定（决定是否 ESCALATE）──
  block_timeout_hours: 24.0     # 任务处于 BLOCKED 超过该小时数 → 升级项目经理
  escalate_to: "project_manager" # 升级上报对象

  # ── 催促节奏（打扰成本控制，避免过度打扰）──
  push_cooldown_hours: 6.0      # 同一任务两次正式催办(firm)的最小间隔，低于则进入冷却(不重复催)
  warn_cooldown_hours: 1.0      # 同一任务两次友好预警(soft/WARN)的最小间隔，与正式催办冷却分离
                                # 注: soft 不占用 push_cooldown 冷却，避免抢占 firm 正式催办时机
  max_pushes_per_task: 3        # 单任务最多正式催办次数，超出后必须升级(不再无效催办)
                                # 注: 正式催办(firm)才计入；友好预警(soft/WARN)不消耗此额度
  escalate_cooldown_hours: 24.0 # 同一任务两次升级的最小间隔(小时)，防重复轰炸 PM
                                # 冷却期内对同任务降级为低频 WARN 预警，不重复升级
  max_decisions_keep: 1000      # 决策留痕上限(条)，超过滚动丢弃最旧，防内存泄漏
  reminder_intensity:           # 催办力度分级：越临近/越落后 → 措辞越强
    watch:    "normal"          # 仅跟踪，不打扰
    warn:     "soft"            # 友好提醒（接近 DDL）
    push:     "firm"            # 明确催办（已落后）
    escalate: "urgent"          # 升级（阻塞超时 / 催办无效）

  # ── 定时扫描节奏 ──
  scan_interval_sec: 30.0       # 心跳扫描任务队列的间隔（秒），<=0 表示仅事件驱动
  watch_topic: "task_events"    # 订阅的全局任务事件主题（完成/阻塞/失败等）

  # ── 通知目标 ──
  notify_owner_on_push: true    # 催办时通知任务 owner
  notify_pm_on_escalate: true   # 升级时通知项目经理
