# ============================================================
# 角色-实现映射索引 (Role Inventory)
# 版本: v1.0
# 说明: 单一事实来源，记录每个 role_id 的声明来源与实现状态，
#       用于解决"声明≠存在"问题，配合 role_inventory.py --gap 输出差距。
#
# 状态说明:
#   implemented      = 有真实 Agent 行为承接（独立实现类 / 部门Agent兜底 / handler实体化）
#   registered_only  = 仅注册进 message_bus 可派发，无承接 handler（任务停滞TODO）
#   declared_only    = 仅声明定义，无任何 Agent 行为
#   preset_standby   = 预设备用，按需实例化
# ============================================================


project:
  name: "Game Studio Agents"
  version: "1.0.0"
