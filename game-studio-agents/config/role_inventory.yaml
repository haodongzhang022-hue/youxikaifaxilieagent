# ============================================================
# 角色-实现映射索引 (Role → Implementation Inventory)
# 版本: v1.0
# 说明: 对齐架构师 CP1 收口的角色-实现映射索引（WP-01）。
#       事实源口径（对齐架构师 [LOW] 风险规避）：
#         - ecosystem_roles.yaml 为生态角色事实源（21 个）
#         - roles.yaml 为研发岗位事实源（58 个）
#         - 本文件 role_inventory.yaml 仅为「映射索引」，不重复定义角色行为，
#           只标注每个声明角色的实现状态与承接实现。
#
# 状态取值（status）：
#   implemented     — 有真实可执行 handler / 实现类，能承接 TASK_ASSIGN 并真实 DONE
#   registered_only — 已注册到 message_bus（可派发），但暂无真实承接 handler
#   declared_only   — 仅在事实源声明，未注册、未实现
#   preset_standby  — role_presets.yaml 预置待命，按需启用
#
# 强制对照：role_inventory.py 的 --list / --gap 会强制跑
#   ecosystem_role_registry.summary() 与 WP-02 的 ecosystem_handlers 注册命名
#   逐项比对，防止 WP-03 `_all_done` 空转。
# ============================================================

inventory:
