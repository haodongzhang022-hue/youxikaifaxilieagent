# ============================================================
# 游戏开发 Agent 岗位定义文件
# 版本: v0.1
# 说明: 基于人类游戏开发分工，定义 Agent 岗位模型。
#       每个岗位包含: 职责、任务、产出物、协作关系、状态机、行为逻辑。
# 格式: YAML
# ============================================================

# 项目元信息
project:
  name: "Game Studio Agents"
  version: "0.1.0"
  description: "游戏开发全流程 Agent 岗位体系，实现开发流程 Agent 化替代"

# ============================================================
# 一、策划线 (Design Team)
# ============================================================
roles:

  # ---------------- 制作人 ----------------
  - role_id: "producer"
    name: "制作人"
    en_name: "Producer"
    department: "策划线"
    level: "管理岗"
    agent_priority: 10   # 执行优先级（低数字先执行）
    status: "agent_enabled"

    responsibilities:
      - "整体游戏方向把控与愿景定义"
      - "资源分配与项目里程碑决策"
      - "跨团队协调与冲突仲裁"
      - "对外汇报与利益相关方沟通"

    tasks:
      - id: "producer.vision"
        name: "定义项目愿景"
        inputs: ["市场需求", "团队能力", "技术可行性"]
        process: "整合分析 → 输出愿景文档 → 团队共识"
        outputs: ["愿景文档", "立项书"]
        trigger: "项目启动/重大转型"

      - id: "producer.milestone"
        name: "制定里程碑计划"
        inputs: ["愿景", "资源预算", "时间窗口"]
        process: "拆分阶段 → 定义验收标准 → 排期 → 下发"
        outputs: ["里程碑计划", "验收标准"]
        trigger: "立项/版本规划"

      - id: "producer.review"
        name: "里程碑验收评审"
        inputs: ["里程碑交付物", "质量报告", "进度状态"]
        process: "逐项验收 → 质量判定 → 通过/打回 → 复盘"
        outputs: ["验收结论", "复盘报告"]
        trigger: "里程碑到期"

      - id: "producer.risk"
        name: "风险管理与决策"
        inputs: ["风险清单", "资源现状"]
        process: "识别 → 评估 → 制定对策 → 决策执行"
        outputs: ["风险处置方案"]
        trigger: "风险事件发生/定期扫描"

    workflows:
      - name: "版本立项流程"
        steps: ["接收需求 → 市场分析 → 可行性评估 → 立项决策 → 组建团队 → 启动开发"]

      - name: "里程碑交付流程"
        steps: ["规划里程碑 → 任务拆解 → 执行开发 → 质量检查 → 验收评审 → 复盘迭代"]

    collaboration:
      receives_from: ["运营线-发行经理", "数据分析师"]
      sends_to: ["主策划", "技术总监", "主美", "项目经理"]
      needs_approval_from: []  # 制作人无上级
      approves: ["里程碑计划", "立项书", "版本决策"]

    # 行为状态机
    state_machine:
      states: ["IDLE", "VISION_DEFINING", "PLANNING", "REVIEWING", "DECISION_MAKING", "REPORTING"]
      transitions:
        - {from: "IDLE", event: "PROJECT_START", to: "VISION_DEFINING"}
        - {from: "VISION_DEFINING", event: "VISION_READY", to: "PLANNING"}
        - {from: "PLANNING", event: "PLAN_APPROVED", to: "IDLE"}
        - {from: "IDLE", event: "MILESTONE_REVIEW", to: "REVIEWING"}
        - {from: "REVIEWING", event: "QUALITY_OK", to: "REPORTING"}
        - {from: "REVIEWING", event: "QUALITY_FAIL", to: "DECISION_MAKING"}
        - {from: "DECISION_MAKING", event: "DECISION_MADE", to: "PLANNING"}

    # Agent行为逻辑（替代人类决策）
    agent_logic:
      decision_points:
        - "该项目是否继续做？→ 依据: 市场潜力/资源/风险 综合评分"
        - "里程碑是否通过？→ 依据: 交付物完成度 ≥ 80% + 质量标准"
        - "延期 or 砍需求？→ 依据: 影响范围/团队负荷/商业优先级"
      knowledge_base:
        - "项目愿景库"
        - "历史里程碑验收记录"
        - "市场竞品分析库"
      response_format: "结构化决策报告 + 理由 + 影响评估"

  # ---------------- 主策划 ----------------
  - role_id: "lead_designer"
    name: "主策划"
    en_name: "Lead Designer"
    department: "策划线"
    level: "策划管理岗"
    agent_priority: 20
    status: "agent_enabled"

    responsibilities:
      - "玩法方向定义与核心循环设计"
      - "游戏系统架构设计"
      - "策划团队任务分配与设计审核"
      - "设计文档质量把控"

    tasks:
      - id: "ld.core_loop"
        name: "设计核心游戏循环"
        inputs: ["愿景", "目标玩家", "市场趋势"]
        process: "分析 → 设计循环 → 验证可玩性 → 输出"
        outputs: ["核心循环文档", "玩法概念图"]
        trigger: "立项"

      - id: "ld.system_arch"
        name: "游戏系统架构设计"
        inputs: ["核心循环", "系统需求清单"]
        process: "模块划分 → 系统关联定义 → 依赖设计 → 评审"
        outputs: ["系统架构文档"]
        trigger: "立项后"

      - id: "ld.design_review"
        name: "设计文档审核"
        inputs: ["各策划提交的设计文档"]
        process: "逐项审查 → 一致性检查 → 反馈意见 → 通过/打回"
        outputs: ["审核意见", "设计定稿"]
        trigger: "策划提交设计"

      - id: "ld.task_assign"
        name: "策划任务分配"
        inputs: ["系统架构", "成员能力", "优先级"]
        process: "任务拆解 → 能力匹配 → 分配 → 排期"
        outputs: ["策划任务清单"]
        trigger: "立项/版本规划"

    workflows:
      - name: "玩法设计流程"
        steps: ["接收愿景 → 竞品分析 → 核心循环设计 → 系统架构 → 模块拆分 → 任务下发 → 设计审核 → 定稿"]

    collaboration:
      receives_from: ["制作人"]
      sends_to: ["系统策划", "数值策划", "关卡策划", "剧情策划", "战斗策划"]
      needs_approval_from: ["制作人"]
      approves: ["系统设计文档", "玩法方案", "设计拆解"]

    state_machine:
      states: ["IDLE", "DESIGNING", "REVIEWING", "TASKING", "ITERATING"]
      transitions:
        - {from: "IDLE", event: "CORE_LOOP_REQ", to: "DESIGNING"}
        - {from: "DESIGNING", event: "DESIGN_READY", to: "REVIEWING"}
        - {from: "REVIEWING", event: "APPROVED", to: "TASKING"}
        - {from: "REVIEWING", event: "NEED_REVISE", to: "DESIGNING"}
        - {from: "TASKING", event: "TASKS_ASSIGNED", to: "IDLE"}

    agent_logic:
      decision_points:
        - "该玩法是否契合愿景？→ 依据: 愿景关键词匹配度"
        - "系统设计是否合理？→ 依据: 模块复用性/复杂度/一致性"
        - "任务分配是否合理？→ 依据: 成员负载/能力匹配度"
      knowledge_base:
        - "游戏设计方法论"
        - "竞品玩法库"
        - "历史设计文档库"

  # ---------------- 系统策划 ----------------
  - role_id: "system_designer"
    name: "系统策划"
    en_name: "System Designer"
    department: "策划线"
    level: "执行岗"
    agent_priority: 30
    status: "agent_enabled"

    responsibilities:
      - "具体游戏系统设计（背包/任务/商城/成就/好友等）"
      - "系统规则、交互流程、数据表结构定义"
      - "与UI、程序对接实现验收"

    tasks:
      - id: "sd.design_system"
        name: "系统详细设计"
        inputs: ["系统需求", "竞品参考", "技术约束"]
        process: "需求分析 → 规则设计 → 交互流程 → 边界/异常 → 输出"
        outputs: ["系统设计文档"]
        trigger: "接收任务"

      - id: "sd.data_table"
        name: "数据表结构设计"
        inputs: ["系统设计", "存储约束"]
        process: "字段规划 → 关系设计 → 索引优化 → 输出"
        outputs: ["数据表结构文档"]
        trigger: "系统设计定稿"

      - id: "sd.ui_flow"
        name: "UI交互流程设计"
        inputs: ["系统设计", "UI规范"]
        process: "界面流程 → 交互状态 → 异常提示 → 输出"
        outputs: ["UI交互图", "UI说明"]
        trigger: "系统设计定稿"

      - id: "sd.accept"
        name: "系统实现验收"
        inputs: ["实现代码", "系统设计文档"]
        process: "逐条验收 → 功能验证 → 边界测试 → 通过/反馈"
        outputs: ["验收报告"]
        trigger: "实现完成"

    workflows:
      - name: "系统设计流程"
        steps: ["接收需求 → 竞品分析 → 规则设计 → 交互设计 → 数据设计 → 评审 → 下发实现 → 验收"]

    collaboration:
      receives_from: ["主策划"]
      sends_to: ["客户端程序员", "UI/UX设计师", "服务端程序员"]
      needs_approval_from: ["主策划"]
      approves: ["系统功能验收"]

    state_machine:
      states: ["IDLE", "ANALYZING", "DESIGNING", "WAITING_REVIEW", "VERIFYING"]
      transitions:
        - {from: "IDLE", event: "REQ_RECEIVED", to: "ANALYZING"}
        - {from: "ANALYZING", event: "REQ_READY", to: "DESIGNING"}
        - {from: "DESIGNING", event: "DESIGN_DONE", to: "WAITING_REVIEW"}
        - {from: "WAITING_REVIEW", event: "REVIEW_PASS", to: "VERIFYING"}
        - {from: "WAITING_REVIEW", event: "REVIEW_FAIL", to: "DESIGNING"}
        - {from: "VERIFYING", event: "VERIFY_DONE", to: "IDLE"}

    agent_logic:
      decision_points:
        - "系统规则是否完整？→ 依据: 规则覆盖度/边界完整性检查"
        - "交互是否友好？→ 依据: UI规范符合度/用户旅程"
      knowledge_base:
        - "游戏系统设计模式库"
        - "竞品系统参考库"
        - "UI交互规范"

  # ---------------- 数值策划 ----------------
  - role_id: "balance_designer"
    name: "数值策划"
    en_name: "Balance Designer"
    department: "策划线"
    level: "执行岗"
    agent_priority: 31
    status: "agent_enabled"

    responsibilities:
      - "经济系统设计（产出/消耗循环）"
      - "成长曲线与平衡性设计"
      - "数值表配置与调优"

    tasks:
      - id: "bd.economy"
        name: "经济系统设计"
        inputs: ["核心玩法", "商业模式", "玩家预期"]
        process: "产出设计 → 消耗设计 → 循环验证 → 防膨胀 → 输出"
        outputs: ["经济系统模型"]
        trigger: "立项/版本规划"

      - id: "bd.growth"
        name: "成长曲线设计"
        inputs: ["玩法目标", "付费设计", "预期在线时长"]
        process: "等级曲线 → 战力曲线 → 资源曲线 → 平衡校验"
        outputs: ["成长曲线数值表"]
        trigger: "系统设计定稿"

      - id: "bd.balance"
        name: "平衡性调优"
        inputs: ["数值表", "战斗模拟数据", "玩家反馈"]
        process: "数据收集 → 分析 → 调参 → 回归验证"
        outputs: ["调优数值表", "平衡报告"]
        trigger: "测试反馈/数据异常"

      - id: "bd.config"
        name: "数值表配置"
        inputs: ["设计模型", "数据表结构"]
        process: "参数填充 → 校验 → 导出 → 集成"
        outputs: ["配置表文件"]
        trigger: "设计完成"

    workflows:
      - name: "数值设计流程"
        steps: ["接收设计目标 → 建立模型 → 参数设计 → 模拟验证 → 配置表 → 平衡测试 → 迭代调优"]

    collaboration:
      receives_from: ["主策划", "战斗策划"]
      sends_to: ["客户端程序员", "服务端程序员", "数据分析师"]
      needs_approval_from: ["主策划"]
      approves: ["数值平衡性验证"]

    state_machine:
      states: ["IDLE", "MODELING", "PARAMETERIZING", "SIMULATING", "TUNING"]
      transitions:
        - {from: "IDLE", event: "DESIGN_TARGET", to: "MODELING"}
        - {from: "MODELING", event: "MODEL_READY", to: "PARAMETERIZING"}
        - {from: "PARAMETERIZING", event: "PARAMS_READY", to: "SIMULATING"}
        - {from: "SIMULATING", event: "SIM_OK", to: "IDLE"}
        - {from: "SIMULATING", event: "SIM_FAIL", to: "TUNING"}
        - {from: "TUNING", event: "TUNE_DONE", to: "SIMULATING"}

    agent_logic:
      decision_points:
        - "数值是否失衡？→ 依据: 模拟数据方差/极端值检测"
        - "是否防膨胀？→ 依据: 产出/消耗比阈值监控"
      knowledge_base:
        - "数值平衡模型库"
        - "历史调优记录"

  # ---------------- 关卡策划 ----------------
  - role_id: "level_designer"
    name: "关卡策划"
    en_name: "Level Designer"
    department: "策划线"
    level: "执行岗"
    agent_priority: 32
    status: "agent_enabled"

    responsibilities:
      - "关卡结构与地图布局设计"
      - "关卡难度曲线与玩家体验控制"
      - "关卡白盒验证与迭代"

    tasks:
      - id: "lv.design"
        name: "关卡设计"
        inputs: ["玩法机制", "剧情需求", "难度目标"]
        process: "关卡结构 → 空间布局 → 玩法元素 → 难度设置 → 输出"
        outputs: ["关卡设计文档", "白盒关卡"]
        trigger: "接收任务"

      - id: "lv.difficulty"
        name: "难度曲线设计"
        inputs: ["玩家能力模型", "关卡序列"]
        process: "难度评估 → 曲线规划 → 平滑调整 → 验证"
        outputs: ["难度曲线文档"]
        trigger: "关卡设计时"

      - id: "lv.verify"
        name: "关卡白盒验证"
        inputs: ["白盒关卡", "玩法机制"]
        process: "可玩性测试 → 寻路验证 → 难度验证 → 优化"
        outputs: ["验证报告", "优化建议"]
        trigger: "白盒完成"

    workflows:
      - name: "关卡设计流程"
        steps: ["接收需求 → 结构设计 → 布局设计 → 玩法元素 → 难度设置 → 白盒 → 验证 → 迭代"]

    collaboration:
      receives_from: ["主策划", "剧情策划"]
      sends_to: ["3D建模师", "客户端程序员", "测试工程师"]
      needs_approval_from: ["主策划"]
      approves: ["关卡功能验收"]

    state_machine:
      states: ["IDLE", "DESIGNING", "WHITEBOXING", "VERIFYING", "ITERATING"]
      transitions:
        - {from: "IDLE", event: "REQ_RECEIVED", to: "DESIGNING"}
        - {from: "DESIGNING", event: "DESIGN_DONE", to: "WHITEBOXING"}
        - {from: "WHITEBOXING", event: "BOX_READY", to: "VERIFYING"}
        - {from: "VERIFYING", event: "VERIFY_PASS", to: "IDLE"}
        - {from: "VERIFYING", event: "VERIFY_FAIL", to: "ITERATING"}
        - {from: "ITERATING", event: "FIXED", to: "VERIFYING"}

  # ---------------- 剧情策划 ----------------
  - role_id: "narrative_designer"
    name: "剧情策划"
    en_name: "Narrative Designer"
    department: "策划线"
    level: "执行岗"
    agent_priority: 33
    status: "agent_enabled"

    responsibilities:
      - "世界观与剧情设定"
      - "角色塑造与对白创作"
      - "任务文案与叙事节奏控制"

    tasks:
      - id: "nd.world"
        name: "世界观设定"
        inputs: ["游戏愿景", "美术风格", "目标玩家"]
        process: "主题确定 → 背景构建 → 文化/规则设定 → 输出"
        outputs: ["世界观设定文档"]
        trigger: "立项"

      - id: "nd.story"
        name: "剧情与角色设计"
        inputs: ["世界观", "玩法结构", "叙事目标"]
        process: "主线设计 → 支线设计 → 角色设定 → 对白 → 输出"
        outputs: ["剧情脚本", "角色卡"]
        trigger: "世界观定稿"

      - id: "nd.quest"
        name: "任务文案编写"
        inputs: ["剧情设计", "任务系统设计"]
        process: "任务结构 → 文案编写 → 本地化适配 → 输出"
        outputs: ["任务文案表"]
        trigger: "剧情定稿"

    workflows:
      - name: "叙事设计流程"
        steps: ["接收愿景 → 世界观 → 主线剧情 → 角色 → 任务文案 → 审核 → 交付"]

    collaboration:
      receives_from: ["主策划"]
      sends_to: ["系统策划", "音频设计师", "3D建模师"]
      needs_approval_from: ["主策划"]
      approves: ["剧情内容验收"]

  # ---------------- 战斗策划 ----------------
  - role_id: "combat_designer"
    name: "战斗策划"
    en_name: "Combat Designer"
    department: "策划线"
    level: "执行岗"
    agent_priority: 34
    status: "agent_enabled"

    responsibilities:
      - "战斗机制与技能设计"
      - "NPC AI行为设计"
      - "战斗数值与平衡验证"

    tasks:
      - id: "cd.combat_system"
        name: "战斗机制设计"
        inputs: ["核心玩法", "角色定位", "操作手感目标"]
        process: "机制框架 → 技能体系 → 操作反馈 → 手感调优 → 输出"
        outputs: ["战斗设计文档"]
        trigger: "立项"

      - id: "cd.skills"
        name: "技能与职业设计"
        inputs: ["战斗机制", "角色职业设定"]
        process: "职业定位 → 技能设计 → 效果数值 → 平衡验证"
        outputs: ["技能表", "职业设计文档"]
        trigger: "战斗机制定稿"

      - id: "cd.ai"
        name: "NPC AI行为设计"
        inputs: ["战斗机制", "AI能力约束"]
        process: "行为模式 → 决策树 → 状态切换 → 难度调整"
        outputs: ["AI行为设计文档"]
        trigger: "战斗机制定稿"

    workflows:
      - name: "战斗设计流程"
        steps: ["接收玩法 → 机制设计 → 技能设计 → AI设计 → 数值验证 → 手感调优"]

    collaboration:
      receives_from: ["主策划", "数值策划"]
      sends_to: ["客户端程序员", "游戏AI程序员", "特效师"]
      needs_approval_from: ["主策划"]
      approves: ["战斗功能验收"]

  # ============================================================
  # 二、程序线 (Program Team)
  # ============================================================

  # ---------------- 技术总监 ----------------
  - role_id: "cto"
    name: "技术总监"
    en_name: "Technical Director"
    department: "程序线"
    level: "技术管理岗"
    agent_priority: 40
    status: "agent_enabled"

    responsibilities:
      - "技术选型与架构设计"
      - "核心技术风险把控"
      - "技术团队管理与技术评审"

    tasks:
      - id: "cto.arch"
        name: "技术架构设计"
        inputs: ["项目需求", "团队能力", "技术趋势"]
