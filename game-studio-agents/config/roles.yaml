        process: "内容发布 → 互动管理 → 舆情监控"
        outputs: ["社区内容"]
        trigger: "持续"

      - id: "go.feedback"
        name: "用户反馈处理"
        inputs: ["玩家反馈", "问题分类"]
        process: "收集 → 分类 → 转交 → 跟进 → 回复"
        outputs: ["反馈处理记录"]
        trigger: "玩家反馈"

    workflows:
      - name: "运营流程"
        steps: ["目标设定 → 活动设计 → 上线执行 → 数据监控 → 复盘优化"]

    collaboration:
      receives_from: ["数据分析师", "版本管理"]
      sends_to: ["策划", "数据分析师"]
      needs_approval_from: ["制作人"]
      approves: ["运营活动"]

# ============================================================
# 全局协作规则
# ============================================================
global:
  collaboration_rules:
    - "所有岗位通过结构化消息通信，消息格式统一为 JSON"
    - "每个岗位有明确的状态机，状态转换由事件驱动"
    - "任务完成必须提交产出物并触发下游岗位"
    - "跨岗位决策需要上级审批的必须走审批流程"
    - "所有任务有明确的验收标准，验收通过才算完成"

  message_bus:
    type: "事件驱动消息总线"
    message_types: ["TASK", "REVIEW", "REPORT", "BUG", "APPROVAL", "NOTIFICATION"]
    message_format:
      - id: "唯一消息ID"
      - type: "消息类型"
      - from: "发送岗位"
      - to: "接收岗位"
      - task_id: "关联任务"
      - content: "消息内容(JSON)"
      - timestamp: "时间戳"
      - priority: "优先级"

  iteration_strategy:
    - "v0.1: 岗位定义与行为逻辑框架"
    - "v0.2: Agent间消息通信与协作流程"
    - "v0.3: 核心岗位自动执行（策划→程序→测试流水线）"
    - "v0.4: 全流程自动执行与质量闭环"
    - "v0.5: 数据驱动决策与持续优化"
